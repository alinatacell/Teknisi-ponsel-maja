<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pelanggan Approved</title><link rel="stylesheet" href="style.css"></head><body><header><div class="wrap"><div class="logo">ORDER KOMUNITAS</div><div class="user" data-user></div></div></header>
<nav><div class="wrap">
<a href="index.html">Dashboard</a><a href="produk.html">Produk</a><a href="input-order.html">Input Order</a><a href="penerima-order.html">Approval</a><a href="daftar-order.html">Daftar Order</a><a href="pelanggan-approved.html">Pelanggan Approved</a><a href="data-keuangan.html">Keuangan</a>
</div></nav><main><div class="between"><h1>Pelanggan Approved</h1><input id="search" style="max-width:320px" placeholder="Cari nama / WA"></div><div id="list"></div></main>
<script type="module">
import {db,requireLogin,money,esc} from "./firebase.js";
import {collection,onSnapshot,query,where} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
let all=[];requireLogin(()=>onSnapshot(query(collection(db,"communityOrders"),where("status","in",["disetujui","diproses","selesai"])),s=>{all=s.docs.map(d=>({id:d.id,...d.data()}));render()}));search.oninput=render;
function key(o){return (o.noWa||"").replace(/\D/g,"")||("name:"+String(o.namaPelanggan||"").trim().toLowerCase())}
function render(){const m=new Map();for(const o of all){const k=key(o);const x=m.get(k)||{nama:o.namaPelanggan,wa:o.noWa,alamat:o.alamat,orders:0,total:0,last:o.tanggal||""};x.orders++;x.total+=Number(o.total)||0;if((o.tanggal||"")>x.last)x.last=o.tanggal;m.set(k,x)}const q=search.value.toLowerCase();const rows=[...m.values()].filter(x=>!q||[x.nama,x.wa,x.alamat].join(" ").toLowerCase().includes(q));list.innerHTML=rows.map(x=>`<div class="card"><div class="between"><h2>${esc(x.nama)}</h2><span class="badge ok">APPROVED</span></div><div>${esc(x.wa)}<br>${esc(x.alamat)}</div><div class="grid3" style="margin-top:12px"><div><b>${x.orders}</b><div class="muted">Jumlah order</div></div><div><b>${money(x.total)}</b><div class="muted">Total order</div></div><div><b>${esc(x.last)}</b><div class="muted">Order terakhir</div></div></div></div>`).join("")||'<div class="card empty">Belum ada pelanggan approved.</div>'}
</script></body></html>
