<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Input Order</title><link rel="stylesheet" href="style.css"></head><body><header><div class="wrap"><div class="logo">ORDER KOMUNITAS</div><div class="user" data-user></div></div></header>
<nav><div class="wrap">
<a href="index.html">Dashboard</a><a href="produk.html">Produk</a><a href="input-order.html">Input Order</a><a href="penerima-order.html">Approval</a><a href="daftar-order.html">Daftar Order</a><a href="pelanggan-approved.html">Pelanggan Approved</a><a href="data-keuangan.html">Keuangan</a>
</div></nav><main><h1>Input Pesanan / Order</h1>
<div class="card"><div class="grid"><div><label>Nomor Nota</label><input id="nota" readonly></div><div><label>Tanggal</label><input id="tanggal" type="date"></div><div><label>Nama Pelanggan</label><input id="nama"></div><div><label>No. WhatsApp</label><input id="wa"></div></div><br><label>Alamat</label><textarea id="alamat"></textarea></div>
<div class="card"><h2>Load Produk</h2><div class="grid"><input id="search" placeholder="Cari produk"><select id="product"><option value="">Pilih produk</option></select><input id="qty" type="number" min="1" value="1"><button class="btn" id="addItem">Tambah</button></div></div>
<div class="card"><h2>Rincian Pesanan</h2><div class="tablewrap"><table><thead><tr><th>Produk</th><th>Qty</th><th>Harga</th><th>Subtotal</th><th></th></tr></thead><tbody id="items"></tbody></table></div><div class="total" id="total">Rp0</div><div class="actions"><button class="btn" id="save">Simpan Orderan</button></div><p id="msg" class="alert" style="display:none"></p></div></main>
<script type="module">
import {db,requireLogin,money,esc} from "./firebase.js";
import {collection,getDocs,addDoc,serverTimestamp,query,orderBy} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
let user,products=[],cart=[]; function showMsg(t){msg.style.display="block";msg.textContent=t;}
requireLogin(u=>{user=u;init()});
function genNota(){const d=new Date(),s=d.toISOString().slice(0,10).replaceAll("-","");return "ORD-"+s+"-"+Math.random().toString(36).slice(2,6).toUpperCase()}
async function init(){nota.value=genNota();tanggal.value=new Date().toISOString().slice(0,10);const s=await getDocs(query(collection(db,"communityProducts"),orderBy("name")));products=s.docs.map(d=>({id:d.id,...d.data()}));renderProducts()}
function renderProducts(){const q=search.value.toLowerCase();product.innerHTML='<option value="">Pilih produk</option>'+products.filter(p=>!q||p.name.toLowerCase().includes(q)).map(p=>`<option value="${p.id}">${esc(p.name)} — ${money(p.price)} (stok ${p.stock??0})</option>`).join("")}
search.oninput=renderProducts;
addItem.onclick=()=>{const p=products.find(x=>x.id===product.value),n=Math.max(1,Number(qty.value)||1);if(!p)return;if(n>(p.stock??0))return alert("Qty melebihi stok");const old=cart.find(x=>x.productId===p.id);if(old)old.qty+=n;else cart.push({productId:p.id,name:p.name,price:Number(p.price)||0,qty:n});renderCart()}
function renderCart(){items.innerHTML=cart.map((x,i)=>`<tr><td>${esc(x.name)}</td><td>${x.qty}</td><td>${money(x.price)}</td><td>${money(x.qty*x.price)}</td><td><button class="danger" data-i="${i}">Hapus</button></td></tr>`).join("");items.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{cart.splice(Number(b.dataset.i),1);renderCart()});total.textContent=money(cart.reduce((s,x)=>s+x.qty*x.price,0))}
save.onclick=async()=>{if(!nama.value.trim()||!wa.value.trim()||!alamat.value.trim())return showMsg("Lengkapi data pelanggan");if(!cart.length)return showMsg("Tambahkan minimal 1 produk");const totalValue=cart.reduce((s,x)=>s+x.qty*x.price,0);showMsg("Menyimpan...");try{await addDoc(collection(db,"communityOrders"),{nomorNota:nota.value,tanggal:tanggal.value,namaPelanggan:nama.value.trim(),noWa:wa.value.trim(),alamat:alamat.value.trim(),items:cart,total:totalValue,status:"menunggu",createdBy:user.uid,createdByName:user.displayName||user.email,createdAt:serverTimestamp(),updatedAt:serverTimestamp()});showMsg("Order berhasil disimpan dan menunggu approval.");cart=[];renderCart();nota.value=genNota();nama.value=wa.value=alamat.value=""}catch(e){msg.textContent=e.message}}
</script></body></html>
