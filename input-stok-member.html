<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Input Stok Member</title><link rel="stylesheet" href="member.css"></head><body><main class="member-wrap"><div class="member-card"><h1>Input Stok Member</h1><div class="member-grid"><input id="nama" class="member-input" placeholder="Nama produk"><input id="brand" class="member-input" placeholder="Brand"><input id="kategori" class="member-input" placeholder="Kategori"><input id="harga" class="member-input" type="number" placeholder="Harga"><input id="stok" class="member-input" type="number" placeholder="Stok PCS"></div><button id="save" class="member-btn member-success" style="margin-top:10px">Simpan Stok</button><p id="msg"></p></div>
<script type="module">import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, onSnapshot, query, orderBy, where, doc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
import {getApps,getApp} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";const auth=getAuth(getApps()[0]||getApp()),db=getFirestore(getApps()[0]||getApp());onAuthStateChanged(auth,u=>{if(!u)location.href="../login.html"});save.onclick=async()=>{if(!nama.value.trim())return msg.textContent="Nama produk wajib.";await addDoc(collection(db,"stokMember"),{nama:nama.value.trim(),brand:brand.value.trim(),kategori:kategori.value.trim(),harga:Number(harga.value)||0,stok:Number(stok.value)||0,createdAt:serverTimestamp(),updatedAt:serverTimestamp()});msg.textContent="Stok member tersimpan.";nama.value=brand.value=kategori.value=harga.value=stok.value=""}</script></main></body></html>
