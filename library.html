<!DOCTYPE html>
<html lang="id">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lagu Saya</title>
<style>
body{margin:0;background:#0b0b0b;color:#fff;font-family:Arial}.wrap{max-width:700px;margin:auto;padding:18px}.head{color:#ffc107;font-size:24px;font-weight:bold;margin:10px 0 20px}
.card{background:#171717;border:1px solid #292929;border-radius:15px;padding:15px;margin-bottom:12px}.small{color:#888;font-size:13px;line-height:1.6}
a{color:#ffc107;text-decoration:none}.song{padding:13px;background:#101010;border-radius:11px;margin-top:10px}.song audio{width:100%;margin-top:10px}
</style></head><body><div class="wrap"><div class="head">🎧 Lagu Saya</div>
<div id="list" class="card"><div class="small">Belum ada lagu.</div></div>
<a href="create.html">＋ Buat Lagu Baru</a></div>
<script>
const box=document.getElementById('list'),result=JSON.parse(localStorage.getItem('lastSongResult')||'null'),task=JSON.parse(localStorage.getItem('lastSongTask')||'null');
if(result&&result.tracks?.length){
 box.innerHTML=result.tracks.map((x,i)=>`<div class="song"><b>🎵 ${x.title||'Lagu '+(i+1)}</b><br><span class="small">${x.tags||'AI Song'}</span><audio controls src="${x.audio_url}"></audio></div>`).join('');
}else if(task){box.innerHTML='<div class="small">⏳ Lagu terakhir masih diproses. Kembali ke Buat Lagu untuk melihat status.</div>'}
</script></body></html>
