<body>
<div class="container">

<form id="loginForm">
<div class="input-box"><label>Email</label><input type="email" id="email" required placeholder="email@gmail.com" oninput="try{isValidEmailStrictFixzy(this.value); this.style.borderColor='#333';}catch(e){this.style.borderColor='#ef4444';}"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import {
  getAuth,
  signInWithEmailAndPassword,
  signOut,
  sendPasswordResetEmail,
  setPersistence,
  browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import {
  getFirestore,
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


// === FIX TELITI: BLOK gmail.co — THEMA TETAP ===
function isValidEmailStrictFixzy(email){
  const e = String(email||"").trim().toLowerCase();
  if(!e) return false;
  if(e.endsWith('@gmail.co')){
    throw new Error('Anda ketik '+e+' — domain gmail.co tidak ada. Harus gmail.com (pakai M)');
  }
  if(e.endsWith('@yahoo.co')||e.endsWith('@hotmail.co')||e.endsWith('@outlook.co')){
    throw new Error('Domain '+e.split('@')[1]+' tidak valid. Gunakan .com');
  }
  if(e.includes('@gmail.') && !e.endsWith('@gmail.com')){
    throw new Error('Gunakan @gmail.com bukan @'+e.split('@')[1]+' — Anda ketik '+e);
  }
  if(!/^[^@]+@[^@]+\.[^@]+$/.test(e)){
    throw new Error('Format email tidak valid');
  }
  return true;
}

const cfg={apiKey:"AIzaSyC_PcarMTT5Un7qfSLzf92o5OGn5rginsI",authDomain:"fixzy-update.firebaseapp.com",projectId:"fixzy-update",storageBucket:"fixzy-update.firebasestorage.app",messagingSenderId:"995892519622",appId:"1:995892519622:web:fa41047944d8e5b35d6dc7"};
const firebaseConfig=cfg;

const app=initializeApp(cfg);
const auth=getAuth(app);
const db=getFirestore(app);

const form=document.getElementById("loginForm");
const btn=document.getElementById("btnLogin");
const loading=document.getElementById("loading");

document.getElementById("lihatPassword").addEventListener("click",()=>{
  const p=document.getElementById("password");
  p.type=p.type==="password" ? "text" : "password";
});

form.addEventListener("submit",async(e)=>{
  e.preventDefault();

  btn.disabled=true;
  loading.style.display="block";

  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;

  try{
    // Persistensi Auth disiapkan SEBELUM login.
    await setPersistence(auth,browserLocalPersistence);

    const cred=await signInWithEmailAndPassword(auth,email,password);
    const uid=cred.user.uid;

    // Verifikasi profil mengikuti Rules baru.
    const snap=await getDoc(doc(db,"users",uid));

    if(!snap.exists()){
      await signOut(auth);
      tampilPopup("Fixzy","Data profil akun tidak ditemukan.");
      return;
    }

    const data=snap.data()||{};
    const role=data.role||"";
    const status=data.status||"";

    if(!["owner","employee","reseller","superadmin","karyawan","iprem"].includes(role)){
      await signOut(auth);
      tampilPopup("Fixzy","Role akun tidak dikenali.");
      return;
    }

    if(status==="blocked" || status==="rejected"){
      await signOut(auth);
      tampilPopup("Fixzy","Akun diblokir / ditolak.\nHubungi Admin Fixzy.");
      return;
    }

    if(status!=="aktif"){
      await signOut(auth);
      tampilPopup("Fixzy","Akun belum aktif.");
      return;
    }

    let expDate=null;
    const exp=data.tanggalBerakhir;

    if(exp && typeof exp.toDate==="function"){
      expDate=exp.toDate();
    }else if(exp){
      const d=new Date(exp);
      if(!Number.isNaN(d.getTime())) expDate=d;
    }

    if(expDate && new Date()>expDate){
      await signOut(auth);

      if(data.perpanjanganStatus==="pending"){
        tampilPopup(
          "Fixzy",
          "Masa aktif sudah habis.\n\nPerpanjangan sedang menunggu persetujuan Admin."
        );
      }else{
        tampilPopup(
          "Fixzy",
          "Masa Trial / Masa Aktif sudah habis.\n\nSilakan ajukan perpanjangan."
        );
      }
      return;
    }

    // Auth sudah sukses dan profil sudah lolos.
    // Tidak memakai localStorage/sessionStorage.
    tampilPopup(
      "Fixzy",
      `Halo ${data.namaKonter||data.namaPemilik||email}!\nAkun aktif sampai ${
        expDate ? expDate.toLocaleDateString("id-ID") : "-"
      }`
    );

    // Beri waktu popup tampil, lalu kembali ke index.
    // ?auth=1 adalah handoff sementara; index tetap verifikasi
    // auth.currentUser + users/{uid} sebelum menampilkan aplikasi.
    setTimeout(()=>{
      window.location.replace("index.html");
    },700);

  }catch(err){
    console.error("FIXZY login:",err);

    let msg="Login gagal.";

    if(
      err.code==="auth/invalid-credential" ||
      err.code==="auth/wrong-password"
    ){
      msg="Email atau password salah.";
    }else if(err.code==="auth/user-not-found"){
      msg="Email tidak terdaftar.";
    }else if(err.code==="auth/too-many-requests"){
      msg="Terlalu banyak percobaan. Coba lagi nanti.";
    }else if(err.code==="permission-denied"){
      msg="Akses profil akun ditolak oleh Rules Firebase.";
    }else if(err.message){
      msg=err.message;
    }

    tampilPopup("Fixzy",msg);

  }finally{
    btn.disabled=false;
    loading.style.display="none";
  }
});

document.getElementById("btnLupa").addEventListener("click",async()=>{
  const email=document.getElementById("email").value.trim();

  if(!email){
    tampilPopup("Fixzy","Isi email dulu untuk reset password.");
    return;
  }

  try{
    await sendPasswordResetEmail(auth,email);
    tampilPopup("Fixzy","Link reset password dikirim ke "+email);
  }catch(err){
    tampilPopup("Fixzy",err.message||"Gagal mengirim link reset password.");
  }
});

window.tampilPopup=(j,p)=>{
  document.getElementById("popupJudul").innerText=j;
  document.getElementById("popupPesan").innerText=p;
  document.getElementById("popup").style.display="flex";
};

window.tutupPopup=()=>{
  document.getElementById("popup").style.display="none";
};
</script>
