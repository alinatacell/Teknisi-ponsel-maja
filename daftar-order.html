<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daftar Order</title><link rel="stylesheet" href="style.css"></head><body><header><div class="wrap"><div class="logo">ORDER KOMUNITAS</div><div class="user" data-user></div></div></header>
<nav><div class="wrap">
<a href="index.html">Dashboard</a><a href="produk.html">Produk</a><a href="input-order.html">Input Order</a><a href="penerima-order.html">Approval</a><a href="daftar-order.html">Daftar Order</a><a href="pelanggan-approved.html">Pelanggan Approved</a><a href="data-keuangan.html">Keuangan</a>
</div></nav><main><div class="between"><h1>Daftar Order Komunitas</h1><input id="search" style="max-width:320px" placeholder="Cari nota / pelanggan / WA"></div><div class="card"><div class="tablewrap"><table><thead><tr><th>Nota</th><th>Tanggal</th><th>Pelanggan</th><th>Rincian</th><th>Total</th><th>Status</th><th>Pembuat / Approval</th></tr></thead><tbody id="tbody"></tbody></table></div></div></main>
<script type="module">
import {db,requireLogin,money,esc} from "./firebase.js";
import {collection,onSnapshot,query,orderBy} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
let all=[];requireLogin(()=>onSnapshot(query(collection(db,"communityOrders"),orderBy("createdAt","desc")),s=>{all=s.docs.map(d=>({id:d.id,...d.data()}));render()}));search.oninput=render;
function render(){const q=search.value.toLowerCase();const rows=all.filter(o=>!q||[o.nomorNota,o.namaPelanggan,o.noWa].join(" ").toLowerCase().includes(q));tbody.innerHTML=rows.map(o=>`<tr><td><b>${esc(o.nomorNota)}</b></td><td>${esc(o.tanggal||"")}</td><td>${esc(o.namaPelanggan)}<br><span class="muted">${esc(o.noWa)}</span></td><td>${(o.items||[]).map(x=>`${esc(x.name)} × ${x.qty}`).join("<br>")}</td><td>${money(o.total)}</td><td>${esc(o.status)}</td><td>${esc(o.createdByName||"")}<br><span class="muted">${esc(o.approvedByName||"Belum approval")}</span></td></tr>`).join("")||'<tr><td colspan="7" class="empty">Belum ada order.</td></tr>'}
</script></body></html>
