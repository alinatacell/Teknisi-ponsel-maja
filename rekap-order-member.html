<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FIXZY | Rekap Order Member</title><style>
*{box-sizing:border-box}
:root{--b:#0b0f14;--b2:#111827;--y:#ffc107;--bg:#eef2f6;--g:#16a34a;--r:#dc2626;--blue:#2563eb;--orange:#f59e0b}
html,body{margin:0;padding:0;overflow-x:hidden}
body{background:var(--bg);color:#111827;font-family:Arial,sans-serif}
header{position:fixed;top:0;left:0;right:0;z-index:9999;height:74px;background:var(--b);color:#fff;border-bottom:3px solid var(--y);display:flex;align-items:center}
.head{width:100%;max-width:1100px;margin:auto;padding:0 12px;display:flex;align-items:center;gap:12px}
.logo{width:52px;height:52px;border-radius:14px;object-fit:contain;background:#000;padding:4px}
.hi{min-width:0;flex:1}.hi h1{margin:0;font-size:18px;font-weight:900}.email{font-size:11px;color:#9ca3af;font-weight:700}
.acts{display:flex;gap:8px}.btn{border:2px solid #111827;border-radius:9px;padding:10px 12px;font-weight:900;cursor:pointer;box-shadow:3px 3px 0 #111827}
.refresh{height:42px;background:transparent;color:#fff;border-color:#334155;box-shadow:none}.dark{height:42px;width:44px;background:#1f2937;color:#facc15;border-color:#334155;box-shadow:none}
main{max-width:1100px;margin:auto;padding:88px 12px 30px}
.notice{font-size:11px;font-weight:800;color:#64748b;margin-bottom:10px}.ok{color:#15803d}.err{color:#dc2626}
.card{background:#fff;border:2px solid #111827;border-radius:12px;padding:15px;margin-bottom:14px;box-shadow:4px 4px 0 #111827}
.title{font-size:16px;font-weight:900;border-bottom:2px solid #111827;padding-bottom:9px;margin-bottom:12px}
.filters{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}
label{display:block;font-size:11px;font-weight:900;color:#4b5563;margin-bottom:5px}
input,select{width:100%;padding:10px;border:2px solid #111827;border-radius:8px;background:#fff;color:#111827;font:inherit;box-shadow:2px 2px 0 #111827}
.money-total{font-size:15px;font-weight:900;margin-top:12px;padding:10px;border:2px solid #111827;border-radius:9px;background:#fffbeb}
.table-wrap{overflow:auto;border:2px solid #111827;border-radius:9px}
table{width:100%;border-collapse:collapse;min-width:0}
@media(max-width:650px){
  .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{min-width:680px}
  th,td{padding:8px 7px;font-size:10px}
  th{font-size:9px}
}
th,td{padding:9px 10px;border-bottom:1px solid #e5e7eb;text-align:left;font-size:11px}
th{background:#111827;color:#fff;font-size:10px;text-transform:uppercase}
td.num{text-align:right;font-weight:800}
tr:last-child td{border-bottom:0}
.total-row td{border-top:2px solid #111827;font-weight:900;background:#fffbeb}
.badge{display:inline-block;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:900;border:1px solid}
.badge.tagihan{background:#fef3c7;border-color:#f59e0b;color:#92400e}
.badge.lunas{background:#dcfce7;border-color:#22c55e;color:#166534}
.empty{text-align:center;padding:25px;color:#64748b;font-size:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.primary{background:#111827;color:#fff}
.secondary{background:#e5e7eb;color:#111827}
body.dark{background:#0b1220;color:#e5e7eb}
body.dark .card{background:#111827;color:#e5e7eb;border-color:#475569}
body.dark .title{border-color:#475569}
body.dark label{color:#9ca3af}
body.dark input,body.dark select{background:#0f172a;color:#fff;border-color:#475569}
body.dark .money-total{background:#1c1917}
body.dark th{background:#020617}
body.dark td{border-color:#334155}
@media(max-width:850px){.filters{grid-template-columns:1fr 1fr}.filters .actions{grid-column:1/-1}}
@media(max-width:650px){
  header{height:68px}
  .hi h1{font-size:16px}
  main{padding:80px 8px 24px}
  .filters{grid-template-columns:1fr}
  .acts .btn{padding:8px}
  .card{padding:12px}
}
</style></head><body>
<header><div class="head"><img class="logo" src="logo.png" alt="FIXZY"><div class="hi"><h1>Rekap Order Member</h1><span id="email" class="email">-</span></div><div class="acts"><button class="btn refresh" type="button" onclick="location.reload()">↻ Refresh</button><button id="dark" class="btn dark" type="button">🌙</button></div></div></header>
<main><div id="notice" class="notice">Menunggu akun...</div>

<div class="card"><div class="title">REKAP ORDER MEMBER</div><div class="filters"><div><label>PERIODE</label><select id="periode"><option value="all">Semua Data</option><option value="month">Bulan Ini</option><option value="year">Tahun Ini</option></select></div><div><label>PENCARIAN MEMBER / NOTA</label><input id="search" placeholder="Nama member / nomor nota..."></div><div class="actions"><button class="btn secondary" type="button" onclick="location.reload()">↻ Muat Ulang</button></div></div></div>

<div class="card"><div class="title">DAFTAR ORDER MEMBER</div><div class="money-total">Total Sisa Tagihan: <b id="sisaTotal">Rp 0</b></div><div class="table-wrap" style="margin-top:12px"><table><thead><tr><th>Nota</th><th>Member</th><th>Jenis</th><th>Status</th><th>Jatuh Tempo</th><th class="num">Qty Order</th><th class="num">Nilai Barang</th><th class="num">UP Pengelola</th><th class="num">Tabungan Member</th><th class="num">Kas Bulanan</th><th class="num">Sisa Tagihan</th></tr></thead><tbody id="orderTable"><tr><td colspan="11" class="empty">Memuat...</td></tr></tbody></table></div></div></main><script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import{getFirestore,collection,query,where,getDocs,getDoc,doc}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const cfg={
 apiKey:"AIzaSyC_PcarMTT5Un7qfSLzf92o5OGn5rginsI",
 authDomain:"fixzy-update.firebaseapp.com",
 projectId:"fixzy-update",
 storageBucket:"fixzy-update.firebasestorage.app",
 messagingSenderId:"995892519622",
 appId:"1:995892519622:web:fa41047944d8e5b35d6dc7"
};
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);
const rp=n=>"Rp "+(Number(n)||0).toLocaleString("id-ID");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=v=>Number(v)||0;
function notice(t,c=""){$("notice").textContent=t;$("notice").className="notice "+c;}
let uid="",ownerUid="",profile={},orders=[],ready=false;
function ownerOf(d){
 const role=String(d.role||"").toLowerCase();
 if(role==="owner")return uid;
 if(role==="superadmin"||role==="super_admin")return "";
 return String(d.ownerUid||d.ownerId||"").trim()||uid;
}
function isCashOrder(r){
 const vals=[r.tipeOrder,r.tipeTransaksi,r.jenisHarga,r.paymentType,r.metodePembayaran,r.jenisPembayaran,r.caraBayar]
   .map(v=>String(v??"").trim().toLowerCase());
 return vals.some(v=>["member_cash","cash","tunai","cash/tunai","cash_tunai","member cash"].includes(v));
}
function orderStatus(r){
 if(isCashOrder(r))return "lunas";
 const p=r._paymentSource||{};
 const states=[r.status,r.approvalStatus,r.statusPembayaran,r.paymentStatus,p.status,p.statusPembayaran,p.paymentStatus]
   .map(v=>String(v??"").trim().toLowerCase());
 if(states.some(v=>["lunas","paid","dibayar","selesai","terbayar"].includes(v)))return "lunas";
 const total=Math.max(0,Number(r.totalBayar??r.total??0)||0);
 const paid=Math.max(0,Number(r.totalDibayar??r.pembayaran??r.dp??0)||0,Number(p.totalDibayar??p.pembayaran??p.dp??0)||0);
 const sisa=Math.max(0,Number(r.sisaBayar??r.sisa??(total-paid))||0);
 return (sisa<=0 || (total>0 && paid>=total))?"lunas":"tagihan";
}
function itemList(r){
 const a=Array.isArray(r.items)?r.items:Array.isArray(r.produkList)?r.produkList:[];
 return a.map(x=>{
  const qty=Math.max(0,Number(x.qty??x.jumlah??x.quantity??0)||0);
  const harga=Math.max(0,Number(x.harga??x.hargaJual??x.hargaSatuan??x.price??0)||0);
  const up=Math.max(0,Number(x.upPengelolaPerPcs??x.upPengelola??x.upPerPcs??0)||0);
  const tabungan=Math.max(0,Number(x.tabunganPerPcs??x.tabungan??x.menabungMemberPerPcs??x.menabungMember??0)||0);
  const total=Math.max(0,Number(x.total??x.totalHarga??x.subtotal??((harga*qty)-Number(x.diskon||0)))||0);
  return{produkId:String(x.produkId||x.id||""),nama:String(x.nama||x.namaProduk||x.kode||x.kodeProduk||"-"),kode:String(x.kode||x.kodeProduk||""),qty,harga,total,upPengelolaPerPcs:up,tabunganPerPcs:tabungan};
 });
}
function dueDate(r){
 if(isCashOrder(r))return null;
 const raw=r.jatuhTempo||r.tanggalJatuhTempo||r.dueDate||"";
 if(!raw)return null;
 if(typeof raw==="object"&&raw?.seconds)return new Date(raw.seconds*1000);
 const s=String(raw);
 if(/^\d{4}-\d{2}-\d{2}$/.test(s)){const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);}
 if(/^\d{2}\/\d{2}\/\d{4}$/.test(s)){const[d,m,y]=s.split("/").map(Number);return new Date(y,m-1,d);}
 const d=new Date(s);return isNaN(d.getTime())?null:d;
}
function inPeriod(r){
 const p=$("periode").value;if(p==="all")return true;
 const raw=r.approvedAt||r.createdAt||r.tanggal||"";let d=null;
 if(typeof raw==="object"&&raw?.seconds)d=new Date(raw.seconds*1000);
 else if(String(raw).match(/^\d{4}-\d{2}-\d{2}$/))d=new Date(String(raw)+"T00:00:00");
 else if(raw)d=new Date(raw);
 if(!d||isNaN(d.getTime()))return true;
 const now=new Date();
 if(p==="month")return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth();
 if(p==="year")return d.getFullYear()===now.getFullYear();
 return true;
}
async function loadOrders(){
 const map=new Map();
 const qs=[query(collection(db,"order_member"),where("ownerUid","==",ownerUid)),query(collection(db,"order_member"),where("ownerId","==",ownerUid))];
 for(const q of qs){try{const s=await getDocs(q);s.forEach(d=>{const x={id:d.id,...d.data()};if(!map.has(d.id))map.set(d.id,x);});}catch(e){console.warn("Query order_member:",e.message);}}
 const arr=[...map.values()];
 await Promise.all(arr.map(async x=>{
  const sid=String(x.sourcePenjualanId||"").trim();if(!sid)return;
  try{
   const ps=await getDoc(doc(db,"penjualan",sid));if(!ps.exists())return;
   const p=ps.data()||{},own=String(p.ownerUid||p.ownerId||"").trim();if(own&&own!==ownerUid)return;
   x._paymentSource=p;
   const sourceItems=Array.isArray(p.items)?p.items:(Array.isArray(p.produkList)?p.produkList:[]);
   const orderItems=Array.isArray(x.items)?x.items:(Array.isArray(x.produkList)?x.produkList:[]);
   if(sourceItems.length){
    const byKey=new Map(sourceItems.map(si=>[String(si.produkId||si.id||si.kode||si.kodeProduk||si.nama||""),si]));
    x.items=(orderItems.length?orderItems:sourceItems).map(oi=>{
     const key=String(oi.produkId||oi.id||oi.kode||oi.kodeProduk||oi.nama||""),si=byKey.get(key)||{};
     return{...si,...oi,upPengelolaPerPcs:Number(oi.upPengelolaPerPcs??oi.upPengelola??si.upPengelolaPerPcs??si.upPengelola??0)||0,tabunganPerPcs:Number(oi.tabunganPerPcs??oi.tabungan??si.tabunganPerPcs??si.tabungan??0)||0};
    });
   }
   for(const k of ["upPengelolaPerPcs","upPengelola","tabunganPerPcs","tabungan","totalUPPengelola","totalUpPengelola","totalTabunganMember","totalTabungan","kasBulanan","uangKasBulanan"]){
    if((x[k]===undefined||x[k]===null||x[k]==="")&&p[k]!==undefined)x[k]=p[k];
   }
  }catch(e){console.warn("Sinkron pembayaran order",x.id,e.message);}
 }));
 orders=arr;
}
function kasMemberMonthKey(r){
 const m=r.member||r.pelanggan||{};
 const memberId=String(r.memberId??r.idMember??r.pelangganId??m.id??m.uid??r.uidMember??m.email??m.wa??m.noWa??m.nama??"-").trim().toLowerCase();
 const raw=r.approvedAt||r.createdAt||r.tanggal||r.tanggalOrder||r.waktu||"";let d=null;
 if(typeof raw==="object"&&raw?.seconds)d=new Date(raw.seconds*1000);else if(raw){const x=new Date(raw);if(!isNaN(x.getTime()))d=x;}
 const ym=d?`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`:"tanpa-bulan";
 return memberId+"|"+ym;
}
function renderRekap(){
 const search=$("search").value.trim().toLowerCase();
 const data=orders.filter(inPeriod).filter(r=>{const m=r.member||r.pelanggan||{};return!search||String(r.nomorNota||r.id||"").toLowerCase().includes(search)||String(m.nama||"").toLowerCase().includes(search);});
 let qty=0,nilai=0,up=0,tabungan=0,kas=0,sisaTotal=0;
 const kasBulananMap=new Map();
 data.forEach(r=>{const raw=Number(r.kasBulanan??r.uangKasBulanan??r.kasBulananMember??r.uangKas??0)||0,key=kasMemberMonthKey(r),prev=kasBulananMap.get(key)||0;if(raw>prev)kasBulananMap.set(key,raw);});
 const kasSudahDitampilkan=new Set();
 const rows=data.map(r=>{
  const items=itemList(r),q=items.reduce((a,x)=>a+x.qty,0),value=items.reduce((a,x)=>a+x.total,0),cash=isCashOrder(r);
  const total=Math.max(0,Number(r.totalBayar??r.total??value)||0),p=r._paymentSource||{};
  const paid=Math.max(0,Number(r.totalDibayar??r.pembayaran??r.dp??0)||0,Number(p.totalDibayar??p.pembayaran??p.dp??0)||0);
  const explicitPaid=[r.statusPembayaran,r.paymentStatus,p.statusPembayaran,p.paymentStatus].map(v=>String(v??"").trim().toLowerCase());
  const sourceTotal=Math.max(0,Number(p.totalBayar??p.total??0)||0);
  const paidFull=explicitPaid.some(v=>["lunas","paid","dibayar","selesai","terbayar"].includes(v))||(sourceTotal>0&&paid>=sourceTotal);
  const sisa=cash||paidFull?0:Math.max(0,Number(r.sisaBayar??r.sisa??(total-paid))||0),st=orderStatus(r),jenis=cash?"CASH":"TEMPO";
  const upDefault=Math.max(0,Number(r.upPengelolaPerPcs??r.upPengelola??r.upPerPcs??0)||0),tabDefault=Math.max(0,Number(r.tabunganPerPcs??r.tabungan??r.menabungMemberPerPcs??r.menabungMember??0)||0);
  const upRowCalc=items.reduce((a,x)=>a+x.qty*(Number(x.upPengelolaPerPcs)||upDefault),0);
  const tabRowCalc=items.reduce((a,x)=>a+x.qty*(Number(x.tabunganPerPcs)||tabDefault),0);
  const upRow=upRowCalc>0?upRowCalc:Math.max(0,Number(r.totalUpPengelola??r.totalUPPengelola??r.upPengelolaTotal??r.totalUp??0)||0);
  const tabRow=tabRowCalc>0?tabRowCalc:Math.max(0,Number(r.totalTabunganMember??r.totalTabungan??r.tabunganTotal??0)||0);
  const kasKey=kasMemberMonthKey(r),kasRow=!kasSudahDitampilkan.has(kasKey)?kasBulananMap.get(kasKey)||0:0;kasSudahDitampilkan.add(kasKey);
  qty+=q;nilai+=value;up+=upRow;tabungan+=tabRow;kas+=kasRow;sisaTotal+=sisa;
  const m=r.member||r.pelanggan||{},due=dueDate(r);
  return `<tr><td><b>${esc(r.nomorNota||r.id)}</b></td><td>${esc(m.nama||"-")}</td><td><span class="badge ${cash?"lunas":"tagihan"}">${jenis}</span></td><td><span class="badge ${st}">${st==="lunas"?"LUNAS":"TAGIHAN"}</span></td><td>${due?due.toLocaleDateString("id-ID"):"-"}</td><td class="num">${q.toLocaleString("id-ID")}</td><td class="num">${rp(value)}</td><td class="num">${rp(upRow)}</td><td class="num">${rp(tabRow)}</td><td class="num">${rp(kasRow)}</td><td class="num">${rp(sisa)}</td></tr>`;
 }).join("");
 $("orderCount")?.remove();$("qtyTotal")?.remove();$("nilaiTotal")?.remove();$("upTotal")?.remove();$("tabunganTotal")?.remove();$("kasTotal")?.remove();
 $("sisaTotal").textContent=rp(sisaTotal);$("orderTable").innerHTML=rows||'<tr><td colspan="11" class="empty">Belum ada order member pada periode ini.</td></tr>';
}
function renderAll(){if(!ready)return;renderRekap();}
$("periode").onchange=renderAll;$("search").oninput=renderAll;
$("dark").onclick=()=>{document.body.classList.toggle("dark");$("dark").textContent=document.body.classList.contains("dark")?"☀️":"🌙"};
onAuthStateChanged(auth,async u=>{
 if(!u){notice("Belum login. Silakan login melalui FIXZY.","err");return;}
 try{
  uid=u.uid;const s=await getDoc(doc(db,"users",uid));if(!s.exists())throw Error("Profil akun tidak ditemukan.");
  profile=s.data()||{};ownerUid=ownerOf(profile);if(!ownerUid)throw Error("Owner akun tidak ditemukan.");
  $("email").textContent=u.email||"-";await loadOrders();ready=true;renderAll();
  notice(`Akun aktif • Rekap Order Member milik Owner ini • ${orders.length} order member.`,"ok");
 }catch(e){console.error(e);notice("Gagal memuat Rekap Order Member: "+e.message,"err");}
});
</script></body></html>
