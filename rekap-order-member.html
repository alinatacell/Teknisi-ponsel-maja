<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FIXZY | Rekap Order Member</title>
<style>
*{box-sizing:border-box}
:root{
  --b:#0b0f14;--y:#ffc107;--bg:#eef2f6;--card:#fff;
  --text:#17202a;--muted:#64748b;--green:#16a34a;--red:#dc2626;
  --line:#e5e7eb;--blue:#2563eb;
}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh}
header{
  position:sticky;top:0;z-index:20;background:var(--b);color:#fff;
  padding:14px 16px;box-shadow:0 2px 8px #0002
}
.header-in{max-width:1100px;margin:auto}
h1{font-size:20px;margin:0 0 4px}
.sub{font-size:12px;color:#cbd5e1}
main{max-width:1100px;margin:0 auto;padding:14px}
.status{
  padding:11px 13px;border-radius:10px;background:#fff;border:1px solid var(--line);
  margin-bottom:12px;font-size:13px
}
.status.ok{border-color:#bbf7d0;background:#f0fdf4;color:#166534}
.status.warn{border-color:#fde68a;background:#fffbeb;color:#92400e}
.status.err{border-color:#fecaca;background:#fef2f2;color:#991b1b}
.toolbar{
  display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px
}
.toolbar input,.toolbar select,.toolbar button{
  border:1px solid #d1d5db;border-radius:9px;padding:10px 11px;background:#fff;font-size:13px
}
.toolbar input{flex:1;min-width:180px}
.toolbar button{cursor:pointer;font-weight:700}
.btn-y{background:var(--y)!important;border-color:var(--y)!important}
.summary{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px
}
.sum-card{
  background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px
}
.sum-label{font-size:11px;color:var(--muted);margin-bottom:5px}
.sum-val{font-size:18px;font-weight:800}
.panel{
  background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:14px;
  overflow:hidden;box-shadow:0 1px 3px #00000008
}
.panel-head{
  padding:13px 14px;background:#f8fafc;border-bottom:1px solid var(--line);
  display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap
}
.panel-title{font-weight:800}
.panel-count{font-size:12px;color:var(--muted)}
.panel-body{padding:14px}
.money-grid{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px
}
.money{
  border:1px solid var(--line);border-radius:11px;padding:11px;background:#fff
}
.money.main{background:#f8fafc}
.money.add{background:#fffbeb}
.money.total{background:#f0fdf4;border-color:#bbf7d0}
.money-label{font-size:11px;color:var(--muted);margin-bottom:4px}
.money-val{font-size:18px;font-weight:800}
.breakdown{
  margin-top:10px;padding-top:10px;border-top:1px dashed #d1d5db;
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px
}
.break-item{font-size:12px}
.break-item b{display:block;font-size:14px;margin-top:2px}
.order-foot{
  margin-top:12px;padding-top:10px;border-top:1px solid var(--line);
  font-size:12px;color:var(--muted);font-weight:700
}
.member-list{margin-top:10px}
.member-row{
  display:flex;justify-content:space-between;gap:10px;padding:8px 0;
  border-bottom:1px solid #f1f5f9;font-size:12px
}
.member-row:last-child{border-bottom:0}
.empty{
  background:#fff;border:1px dashed #cbd5e1;border-radius:12px;padding:28px 15px;
  text-align:center;color:var(--muted)
}
.loading{padding:25px;text-align:center;color:var(--muted)}
@media(max-width:700px){
  .summary{grid-template-columns:repeat(2,minmax(0,1fr))}
  .money-grid{grid-template-columns:1fr}
  .breakdown{grid-template-columns:1fr 1fr 1fr}
}
@media(max-width:430px){
  main{padding:10px}
  .summary{gap:7px}
  .sum-val{font-size:16px}
  .breakdown{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header>
  <div class="header-in">
    <h1>FIXZY | Rekap Order Member</h1>
    <div class="sub" id="accountLine">Menunggu akun…</div>
  </div>
</header>

<main>
  <div id="notice" class="status">Menghubungkan ke Firebase…</div>

  <div class="toolbar">
    <input id="search" type="search" placeholder="Cari member / nota…">
    <select id="statusFilter">
      <option value="all">Semua status</option>
      <option value="approved">Approved</option>
      <option value="selesai">Selesai</option>
      <option value="pending">Pending</option>
      <option value="rejected">Rejected</option>
    </select>
    <button id="refreshBtn" class="btn-y">↻ Refresh</button>
  </div>

  <div id="summary" class="summary"></div>
  <div id="content"><div class="loading">Menunggu akun…</div></div>
</main>

<script type="module">
import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  setPersistence,
  browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

import {
  getFirestore,
  collection,
  getDocs,
  query,
  where
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey:"AIzaSyC_PcarMTT5Un7qfSLzf92o5OGn5rginsI",
  authDomain:"fixzy-update.firebaseapp.com",
  projectId:"fixzy-update",
  storageBucket:"fixzy-update.firebasestorage.app",
  messagingSenderId:"995892519622",
  appId:"1:995892519622:web:fa41047944d8e5b35d6dc7"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = id => document.getElementById(id);

function esc(s){
  return String(s ?? "").replace(/[&<>"]/g,c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;"
  }[c]));
}

function notice(text,type=""){
  const el=$("notice");
  el.textContent=text;
  el.className="status"+(type ? " "+type : "");
}

function rupiah(n){
  const x=Number(n)||0;
  return "Rp "+Math.round(x).toLocaleString("id-ID");
}

function num(v){
  if(v===null || v===undefined || v==="") return 0;
  if(typeof v==="number") return isFinite(v)?v:0;
  let s=String(v).trim().replace(/\s/g,"");
  if(!s) return 0;
  if(s.includes(",") && s.includes(".")){
    if(s.lastIndexOf(",")>s.lastIndexOf(".")) s=s.replace(/\./g,"").replace(",",".");
    else s=s.replace(/,/g,"");
  }else if(s.includes(".")){
    const parts=s.split(".");
    if(parts.length===2 && parts[1].length<=2) s=s.replace(",",".");
    else s=s.replace(/\./g,"");
  }else{
    s=s.replace(",",".");
  }
  const n=parseFloat(s);
  return isFinite(n)?n:0;
}

function pick(o, keys, fallback=0){
  for(const k of keys){
    if(o && o[k]!==undefined && o[k]!==null && o[k]!=="") return o[k];
  }
  return fallback;
}

function textPick(o, keys, fallback=""){
  for(const k of keys){
    if(o && o[k]!==undefined && o[k]!==null && String(o[k]).trim()!=="")
      return String(o[k]).trim();
  }
  return fallback;
}

function dateOf(v){
  if(!v) return null;
  if(typeof v?.toDate==="function"){
    try{return v.toDate()}catch{}
  }
  if(v instanceof Date) return isNaN(v.getTime())?null:v;
  if(typeof v==="object" && v.seconds!==undefined){
    const d=new Date(Number(v.seconds)*1000);
    return isNaN(d.getTime())?null:d;
  }
  const s=String(v).trim();
  if(!s) return null;

  if(/^\\d{2}\/\\d{2}\/\\d{4}$/.test(s)){
    const [dd,mm,yyyy]=s.split("/").map(Number);
    const d=new Date(yyyy,mm-1,dd);
    return isNaN(d.getTime())?null:d;
  }

  const d=new Date(s);
  return isNaN(d.getTime())?null:d;
}

function dateLabel(v){
  const d=dateOf(v);
  if(!d) return "Tanpa Jatuh Tempo";
  return d.toLocaleDateString("id-ID",{
    day:"2-digit",month:"long",year:"numeric"
  });
}

function dateKey(v){
  const d=dateOf(v);
  if(!d) return "tanpa-tanggal";
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

function monthKey(v){
  const d=dateOf(v);
  return d
    ? `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`
    : "tanpa-bulan";
}

function statusOf(o){
  return String(
    pick(o,["status","orderStatus","approvalStatus","statusOrder"],"")
  ).trim().toLowerCase();
}

function isRejected(o){
  const s=statusOf(o);
  return ["rejected","reject","ditolak","batal","cancel","cancelled"].includes(s);
}

function isPending(o){
  const s=statusOf(o);
  return ["pending","menunggu","menunggu approval","waiting","diproses"].includes(s);
}

function isApproved(o){
  const s=statusOf(o);
  return ["approved","approve","disetujui","selesai","completed","complete"].includes(s);
}

function paidOf(o){
  return num(pick(o,[
    "totalDibayar","totalBayar","dibayar","pembayaran","paid","jumlahDibayar","dp"
  ],0));
}

function ownerOf(profile, user){
  const role=String(profile?.role || user?.role || "").trim().toLowerCase();

  if(role==="owner"){
    return profile?.ownerUid || profile?.ownerId || user?.uid || null;
  }

  if(["karyawan","karyawan/employee","employee","pegawai"].includes(role)){
    return profile?.ownerUid || profile?.ownerId || null;
  }

  if(role==="superadmin" || role==="super admin"){
    return null;
  }

  return profile?.ownerUid || profile?.ownerId || user?.uid || null;
}

function normalizeOrder(id,data){
  const o={id,...data};

  const qty=num(pick(o,["qty","jumlah","jumlahOrder","totalQty","pieces","pcs"],0));

  const nilaiBarang=num(pick(o,[
    "nilaiBarang","hargaAsli","totalHargaAsli","hargaAsliTotal",
    "subtotal","totalHarga","nilai","totalBarang","hargaBarang"
  ],0));

  const up=num(pick(o,[
    "upPengelola","up","up_pengelola","feePengelola","pengelola"
  ],0));

  const tabungan=num(pick(o,[
    "tabunganMember","tabungan","tabungan_member"
  ],0));

  const kas=num(pick(o,[
    "kasBulanan","uangKas","kas","kasMember","kas_bulanan"
  ],0));

  const tambahan=up+tabungan+kas;
  const tagihanField=pick(o,[
    "totalTagihan","tagihan","grandTotal","totalBayarTagihan"
  ],null);

  const totalTagihan=tagihanField===null || tagihanField===""
    ? nilaiBarang+tambahan
    : num(tagihanField);

  const paid=paidOf(o);
  const jenis=String(pick(o,["jenis","tipePembayaran","paymentType","tipe"],"Tempo"))
    .trim().toLowerCase();

  const cash=["cash","tunai","lunas"].includes(jenis);
  const sisaField=pick(o,["sisaTagihan","sisa","remaining","tagihanSisa"],null);
  const sisa=sisaField===null || sisaField===""
    ? Math.max(0,totalTagihan-paid)
    : Math.max(0,num(sisaField));

  const member=textPick(o,[
    "memberName","namaMember","member","nama","nama_member","customerName"
  ],"Tanpa Nama");

  const nota=textPick(o,[
    "nota","invoice","invoiceNo","nomorNota","noNota","kodeNota","orderNo"
  ],id);

  const due=pick(o,[
    "jatuhTempo","dueDate","tanggalJatuhTempo","tglJatuhTempo",
    "tempoDate","tanggalTempo"
  ],null);

  return {
    ...o,
    qty,
    nilaiBarang,
    up,
    tabungan,
    kas,
    tambahan,
    totalTagihan,
    paid,
    sisa:cash ? 0 : sisa,
    member,
    nota,
    due,
    jenis,
    cash,
    bulanKas:monthKey(due)
  };
}

let currentUser=null;
let currentProfile=null;
let allOrders=[];

async function getUserProfile(uid){
  try{
    const snap=await getDocs(query(
      collection(db,"users"),
      where("uid","==",uid)
    ));
    if(!snap.empty) return {id:snap.docs[0].id,...snap.docs[0].data()};
  }catch(e){
    console.warn("Query users by uid gagal:",e);
  }

  try{
    const snap=await getDocs(collection(db,"users"));
    const found=snap.docs.find(d=>{
      const x=d.data();
      return d.id===uid || x.uid===uid || x.email===currentUser?.email;
    });
    if(found) return {id:found.id,...found.data()};
  }catch(e){
    console.warn("Fallback users gagal:",e);
  }

  return null;
}

async function loadOrders(ownerUid){
  if(!ownerUid) return [];

  const out=new Map();

  const fields=["ownerUid","ownerId","konterOwnerUid"];

  for(const field of fields){
    try{
      const snap=await getDocs(query(
        collection(db,"order_member"),
        where(field,"==",ownerUid)
      ));
      snap.forEach(d=>out.set(d.id,{id:d.id,...d.data()}));
    }catch(e){
      console.warn("Query",field,"gagal:",e);
    }
  }

  // Jika query owner field tidak menemukan data, coba baca koleksi dan
  // filter lokal. Ini membantu pada data lama yang format field-nya berbeda.
  if(out.size===0){
    try{
      const snap=await getDocs(collection(db,"order_member"));
      snap.forEach(d=>{
        const x=d.data();
        const belongs =
          x.ownerUid===ownerUid ||
          x.ownerId===ownerUid ||
          x.konterOwnerUid===ownerUid ||
          x.karyawanOwnerUid===ownerUid;
        if(belongs) out.set(d.id,{id:d.id,...x});
      });
    }catch(e){
      console.warn("Fallback order_member gagal:",e);
    }
  }

  return [...out.values()];
}

function calculateTotals(rows){
  let barang=0,tambahan=0,up=0,tabungan=0,kas=0,tagihan=0,sisa=0,pcs=0;

  rows.forEach(o=>{
    barang+=o.nilaiBarang;
    tambahan+=o.tambahan;
    up+=o.up;
    tabungan+=o.tabungan;
    kas+=o.kas;
    tagihan+=o.totalTagihan;
    sisa+=o.sisa;
    pcs+=o.qty;
  });

  return {barang,tambahan,up,tabungan,kas,tagihan,sisa,pcs,orders:rows.length};
}

function renderSummary(rows){
  const t=calculateTotals(rows);
  $("summary").innerHTML=`
    <div class="sum-card">
      <div class="sum-label">NILAI BARANG</div>
      <div class="sum-val">${rupiah(t.barang)}</div>
    </div>
    <div class="sum-card">
      <div class="sum-label">TAMBAHAN</div>
      <div class="sum-val">${rupiah(t.tambahan)}</div>
    </div>
    <div class="sum-card">
      <div class="sum-label">TOTAL TAGIHAN</div>
      <div class="sum-val">${rupiah(t.tagihan)}</div>
    </div>
    <div class="sum-card">
      <div class="sum-label">SISA TAGIHAN</div>
      <div class="sum-val">${rupiah(t.sisa)}</div>
    </div>
  `;
}

function renderRekap(rows){
  if(!rows.length){
    $("content").innerHTML=`<div class="empty">Tidak ada order member yang sesuai.</div>`;
    return;
  }

  const groups=new Map();

  rows.forEach(o=>{
    const key=dateKey(o.due);
    if(!groups.has(key)){
      groups.set(key,{
        key,
        label:dateLabel(o.due),
        rows:[]
      });
    }
    groups.get(key).rows.push(o);
  });

  const arr=[...groups.values()].sort((a,b)=>{
    if(a.key==="tanpa-tanggal") return 1;
    if(b.key==="tanpa-tanggal") return -1;
    return a.key.localeCompare(b.key);
  });

  $("content").innerHTML=arr.map(g=>{
    const t=calculateTotals(g.rows);

    const memberMap=new Map();
    g.rows.forEach(o=>{
      const key=o.member;
      if(!memberMap.has(key)) memberMap.set(key,{member:key,qty:0,orders:0,total:0,sisa:0});
      const m=memberMap.get(key);
      m.qty+=o.qty;
      m.orders++;
      m.total+=o.totalTagihan;
      m.sisa+=o.sisa;
    });

    const memberRows=[...memberMap.values()].sort((a,b)=>a.member.localeCompare(b.member));

    return `
      <section class="panel">
        <div class="panel-head">
          <div class="panel-title">Jatuh Tempo: ${esc(g.label)}</div>
          <div class="panel-count">${t.orders} order • ${t.pcs} PCS</div>
        </div>

        <div class="panel-body">
          <div class="money-grid">
            <div class="money main">
              <div class="money-label">TOTAL NILAI BARANG / HARGA ASLI SEBELUM UP</div>
              <div class="money-val">${rupiah(t.barang)}</div>
            </div>

            <div class="money add">
              <div class="money-label">TOTAL TAMBAHAN</div>
              <div class="money-val">${rupiah(t.tambahan)}</div>
              <div class="breakdown">
                <div class="break-item">UP Pengelola<b>${rupiah(t.up)}</b></div>
                <div class="break-item">Tabungan Member<b>${rupiah(t.tabungan)}</b></div>
                <div class="break-item">Uang Kas<b>${rupiah(t.kas)}</b></div>
              </div>
            </div>

            <div class="money total">
              <div class="money-label">TOTAL TAGIHAN</div>
              <div class="money-val">${rupiah(t.tagihan)}</div>
            </div>
          </div>

          <div class="order-foot">
            ${t.orders} order • ${t.pcs} PCS
            ${t.sisa>0 ? ` • Sisa ${rupiah(t.sisa)}` : ""}
          </div>

          <div class="member-list">
            ${memberRows.map(m=>`
              <div class="member-row">
                <span><b>${esc(m.member)}</b><br>${m.orders} order • ${m.qty} PCS</span>
                <span style="text-align:right">
                  ${rupiah(m.total)}<br>
                  <small>Sisa ${rupiah(m.sisa)}</small>
                </span>
              </div>
            `).join("")}
          </div>
        </div>
      </section>
    `;
  }).join("");
}

function applyFilter(){
  const q=String($("search").value||"").trim().toLowerCase();
  const filter=$("statusFilter").value;

  const rows=allOrders.filter(o=>{
    const hay=`${o.member} ${o.nota} ${o.id}`.toLowerCase();
    if(q && !hay.includes(q)) return false;

    if(filter==="approved" && !isApproved(o)) return false;
    if(filter==="selesai" && statusOf(o)!=="selesai") return false;
    if(filter==="pending" && !isPending(o)) return false;
    if(filter==="rejected" && !isRejected(o)) return false;

    return true;
  });

  renderSummary(rows);
  renderRekap(rows);
}

async function load(){
  if(!currentUser){
    $("content").innerHTML=`<div class="empty">Belum ada akun Firebase yang aktif.</div>`;
    return;
  }

  notice("Membaca profil akun…");

  currentProfile=await getUserProfile(currentUser.uid);

  const role=String(currentProfile?.role||"").trim().toLowerCase();

  $("accountLine").textContent =
    `${currentProfile?.nama || currentProfile?.name || currentUser.email || currentUser.uid} • ${role || "role tidak terbaca"}`;

  if(["superadmin","super admin"].includes(role)){
    notice("Akun Superadmin tidak membuka data bisnis Owner.", "warn");
    $("content").innerHTML=`
      <div class="empty">
        Rekap Order Member ini khusus untuk <b>Owner</b> dan <b>Karyawan/Employee</b>.
      </div>`;
    $("summary").innerHTML="";
    return;
  }

  const ownerUid=ownerOf(currentProfile,currentUser);

  if(!ownerUid){
    notice("Owner UID tidak ditemukan pada profil akun.", "err");
    $("content").innerHTML=`
      <div class="empty">
        Profil akun belum mempunyai <b>ownerUid</b> atau <b>ownerId</b>.
      </div>`;
    $("summary").innerHTML="";
    return;
  }

  notice("Memuat Order Member…");

  try{
    const raw=await loadOrders(ownerUid);
    allOrders=raw
      .map(x=>normalizeOrder(x.id,x))
      .filter(x=>!isRejected(x));

    applyFilter();

    notice(
      `Akun aktif • ${role||"akun"} • ${allOrders.length} order member.`,
      "ok"
    );
  }catch(e){
    console.error(e);
    notice(`Gagal memuat Order Member: ${e.message||e}`, "err");
    $("content").innerHTML=`
      <div class="empty">
        Gagal membaca data Order Member.<br>
        Periksa Firestore Rules dan field ownerUid/ownerId.
      </div>`;
  }
}

$("refreshBtn").addEventListener("click",load);
$("search").addEventListener("input",applyFilter);
$("statusFilter").addEventListener("change",applyFilter);

setPersistence(auth,browserLocalPersistence).catch(e=>{
  console.warn("Persistence:",e);
});

onAuthStateChanged(auth,user=>{
  currentUser=user||null;

  if(!user){
    $("accountLine").textContent="Belum ada akun aktif";
    notice("Belum login ke Firebase.", "warn");
    $("content").innerHTML=`
      <div class="empty">
        Silakan login ke akun Owner/Karyawan FIXZY terlebih dahulu.
      </div>`;
    $("summary").innerHTML="";
    return;
  }

  load();
});
</script>
</body>
</html>
