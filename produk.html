<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Produk Komunitas</title><link rel="stylesheet" href="style.css"></head><body><header><div class="wrap"><div class="logo">ORDER KOMUNITAS</div><div class="user" data-user></div></div></header>
<nav><div class="wrap">
<a href="index.html">Dashboard</a><a href="produk.html">Produk</a><a href="input-order.html">Input Order</a><a href="penerima-order.html">Approval</a><a href="daftar-order.html">Daftar Order</a><a href="pelanggan-approved.html">Pelanggan Approved</a><a href="data-keuangan.html">Keuangan</a>
</div></nav><main>
<div class="between"><h1>Produk Komunitas</h1><button class="btn" id="add">+ Tambah Produk</button></div>
<div class="card"><div class="grid"><input id="search" placeholder="Cari nama / brand / kategori"><select id="cat"><option value="">Semua kategori</option></select></div></div>
<div id="list" class="grid3"></div>
<div id="modal" class="card" style="display:none"><h2>Tambah / Edit Produk</h2><div class="grid"><div><label>Nama produk</label><input id="pname"></div><div><label>Brand</label><input id="brand"></div><div><label>Kategori</label><input id="category"></div><div><label>Harga</label><input id="price" type="number" min="0"></div><div><label>Stok</label><input id="stock" type="number" min="0"></div><div><label>Foto URL (opsional)</label><input id="image"></div></div><div class="actions"><button class="btn" id="save">Simpan</button><button class="btn2" id="cancel">Batal</button></div></div>
</main><script type="module">
import {db,requireLogin,money,esc,canManageCommunity} from "./firebase.js";
import {collection,addDoc,doc,updateDoc,deleteDoc,onSnapshot,query,orderBy,serverTimestamp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
let uid=null,editId=null,all=[],canManage=false;
requireLogin(u=>{uid=u.uid; canManage=canManageCommunity(u); document.getElementById("add").style.display=canManage?"inline-block":"none"; watch()});
const products=collection(db,"communityProducts");
function watch(){onSnapshot(query(products,orderBy("name")),s=>{all=s.docs.map(d=>({id:d.id,...d.data()}));render()})}
function render(){const q=search.value.toLowerCase(), c=cat.value; const rows=all.filter(p=>(!q||[p.name,p.brand,p.category].join(" ").toLowerCase().includes(q))&&(!c||p.category===c));
cat.innerHTML='<option value="">Semua kategori</option>'+[...new Set(all.map(x=>x.category).filter(Boolean))].sort().map(x=>`<option>${esc(x)}</option>`).join("");
list.innerHTML=rows.length?rows.map(p=>`<div class="product">${p.image?`<img src="${esc(p.image)}" style="width:100%;height:130px;object-fit:contain;border-radius:8px">`:""}<div class="name">${esc(p.name)}</div><div class="muted">${esc(p.brand||"")} · ${esc(p.category||"")}</div><b>${money(p.price)}</b><div class="muted">Stok: ${p.stock??0}</div>${canManage?`<div class="actions"><button class="btn2" data-edit="${p.id}">Edit</button><button class="danger" data-del="${p.id}">Hapus</button></div>`:""}</div>`).join(""):'<div class="empty">Belum ada produk.</div>';
list.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>open(all.find(x=>x.id===b.dataset.edit)));list.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>remove(b.dataset.del))}
function open(p=null){modal.style.display="block";editId=p?.id||null;pname.value=p?.name||"";brand.value=p?.brand||"";category.value=p?.category||"";price.value=p?.price||0;stock.value=p?.stock||0;image.value=p?.image||""}
async function remove(id){if(confirm("Hapus produk?"))await deleteDoc(doc(db,"communityProducts",id))}
add.onclick=()=>open();cancel.onclick=()=>modal.style.display="none";search.oninput=render;cat.onchange=render;
save.onclick=async()=>{if(!canManage){modal.style.display="none";return;}if(!pname.value.trim())return alert("Nama produk wajib diisi");const data={name:pname.value.trim(),brand:brand.value.trim(),category:category.value.trim(),price:Number(price.value)||0,stock:Number(stock.value)||0,image:image.value.trim(),updatedAt:serverTimestamp()};if(editId)await updateDoc(doc(db,"communityProducts",editId),data);else await addDoc(products,{...data,createdBy:uid,createdAt:serverTimestamp()});modal.style.display="none"};
</script></body></html>
