<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stock Member</title><link rel="stylesheet" href="member.css"></head><body><main class="member-wrap"><div class="member-card"><h1>Stock Member</h1><input id="search" class="member-input" placeholder="Cari produk member"></div><div class="member-card"><div class="member-table-wrap"><table class="member-table"><thead><tr><th>Produk</th><th>Brand</th><th>Kategori</th><th>Harga</th><th>Stok PCS</th></tr></thead><tbody id="body"></tbody></table></div></div>
<script type="module">import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, onSnapshot, query, orderBy, where, doc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
import {getApps,getApp} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";const auth=getAuth(getApps()[0]||getApp()),db=getFirestore(getApps()[0]||getApp());let all=[];const money=n=>new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(Number(n)||0),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));onAuthStateChanged(auth,u=>{if(!u){location.href="../login.html";return}onSnapshot(collection(db,"stokMember"),s=>{all=s.docs.map(d=>({id:d.id,...d.data()}));render()})});search.oninput=render;function render(){const q=search.value.toLowerCase();body.innerHTML=all.filter(p=>[p.nama,p.name,p.brand,p.kategori].join(" ").toLowerCase().includes(q)).map(p=>`<tr><td>${esc(p.nama||p.name)}</td><td>${esc(p.brand)}</td><td>${esc(p.kategori)}</td><td>${money(p.harga)}</td><td>${p.stok??0}</td></tr>`).join("")||'<tr><td colspan="5">Belum ada stok member.</td></tr>'}</script></main></body></html>
