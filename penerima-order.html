<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Approval Order</title><link rel="stylesheet" href="style.css"></head><body><header><div class="wrap"><div class="logo">ORDER KOMUNITAS</div><div class="user" data-user></div></div></header>
<nav><div class="wrap">
<a href="index.html">Dashboard</a><a href="produk.html">Produk</a><a href="input-order.html">Input Order</a><a href="penerima-order.html">Approval</a><a href="daftar-order.html">Daftar Order</a><a href="pelanggan-approved.html">Pelanggan Approved</a><a href="data-keuangan.html">Keuangan</a>
</div></nav><main><div class="between"><h1>Penerima Pesanan / Approval</h1><select id="filter"><option value="">Semua</option><option value="menunggu">Menunggu</option><option value="disetujui">Disetujui</option><option value="ditolak">Ditolak</option><option value="diproses">Diproses</option><option value="selesai">Selesai</option></select></div><div id="list"></div></main>
<script type="module">
import {db,requireLogin,money,esc,canManageCommunity} from "./firebase.js";
import {collection,onSnapshot,query,orderBy,doc,updateDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
let user,orders=[],canManage=false;requireLogin(u=>{user=u;canManage=canManageCommunity(u);onSnapshot(query(collection(db,"communityOrders"),orderBy("createdAt","desc")),s=>{orders=s.docs.map(d=>({id:d.id,...d.data()}));render()})});
filter.onchange=render;
function badge(s){return `<span class="badge ${s==="menunggu"?"wait":s==="disetujui"||s==="selesai"?"ok":s==="diproses"?"blue":s==="ditolak"?"red":""}">${esc(s)}</span>`}
function render(){const f=filter.value;const rows=orders.filter(o=>!f||o.status===f);list.innerHTML=rows.length?rows.map(o=>`<div class="card"><div class="between"><b>${esc(o.nomorNota)}</b>${badge(o.status)}</div><p><b>${esc(o.namaPelanggan)}</b> · ${esc(o.noWa)}<br>${esc(o.alamat)}</p><div class="tablewrap"><table><thead><tr><th>Produk</th><th>Qty</th><th>Harga</th><th>Subtotal</th></tr></thead><tbody>${(o.items||[]).map(x=>`<tr><td>${esc(x.name)}</td><td>${x.qty}</td><td>${money(x.price)}</td><td>${money(x.qty*x.price)}</td></tr>`).join("")}</tbody></table></div><div class="total">${money(o.total)}</div><div class="actions">${canManage?(o.status==="menunggu"?`<button class="ok" data-ok="${o.id}">✓ Approve</button><button class="danger" data-no="${o.id}">Tolak</button>`:`<select data-status="${o.id}"><option ${o.status==="disetujui"?"selected":""} value="disetujui">Disetujui</option><option ${o.status==="diproses"?"selected":""} value="diproses">Diproses</option><option ${o.status==="selesai"?"selected":""} value="selesai">Selesai</option><option ${o.status==="ditolak"?"selected":""} value="ditolak">Ditolak</option></select>`):`<span class="muted">Mode lihat — approval hanya Owner/Admin</span>`}</div><div class="muted">Dibuat oleh: ${esc(o.createdByName||o.createdBy||"")}${o.approvedByName?` · Approved oleh: ${esc(o.approvedByName)}`: ""}</div></div>`).join(""):'<div class="card empty">Tidak ada order.</div>';
list.querySelectorAll("[data-ok]").forEach(b=>b.onclick=()=>change(b.dataset.ok,"disetujui"));list.querySelectorAll("[data-no]").forEach(b=>b.onclick=()=>change(b.dataset.no,"ditolak"));list.querySelectorAll("[data-status]").forEach(s=>s.onchange=()=>change(s.dataset.status,s.value))}
async function change(id,status){const data={status,updatedAt:serverTimestamp()};if(status==="disetujui")Object.assign(data,{approvedBy:user.uid,approvedByName:user.displayName||user.email,approvedAt:serverTimestamp()});await updateDoc(doc(db,"communityOrders",id),data)}
</script></body></html>
