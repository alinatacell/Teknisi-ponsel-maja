<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Approval Order Member</title><link rel="stylesheet" href="member.css"></head><body><main class="member-wrap"><div class="member-card"><h1>Approval Order Member</h1><p>Owner sebagai pengelola melakukan approval.</p></div><div id="list"></div>
<script type="module">import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, onSnapshot, query, orderBy, where, doc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
import {getApps,getApp} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";const auth=getAuth(getApps()[0]||getApp()),db=getFirestore(getApps()[0]||getApp());let user,profile,orders=[];const money=n=>new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(Number(n)||0),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));onAuthStateChanged(auth,async u=>{if(!u){location.href="../login.html";return}user=u;const p=await getDocs(query(collection(db,"users"),where("__name__","==",u.uid)));profile=p.empty?{}:p.docs[0].data();const role=String(profile.role||"").toLowerCase();if(!["owner","admin","superadmin"].includes(role)){document.querySelector("p").textContent="Mode lihat. Approval hanya Owner/Admin."; }onSnapshot(query(collection(db,"orderMember"),orderBy("createdAt","desc")),s=>{orders=s.docs.map(d=>({id:d.id,...d.data()}));render(role)})});function render(role){const can=["owner","admin","superadmin"].includes(role);list.innerHTML=orders.map(o=>`<div class="member-card"><b>${esc(o.nomorNota)}</b> — ${esc(o.namaMember)}<p>${(o.items||[]).map(x=>`${esc(x.name)} × ${x.qty}`).join("<br>")}</p><b>${money(o.total)}</b><p>Status: ${esc(o.status)}</p>${can&&o.status==="menunggu"?`<button class="member-btn member-success" data-ok="${o.id}">Approve</button> <button class="member-btn member-danger" data-no="${o.id}">Tolak</button>`:""}</div>`).join("")||'<div class="member-card">Belum ada order.</div>';list.querySelectorAll("[data-ok]").forEach(b=>b.onclick=()=>updateDoc(doc(db,"orderMember",b.dataset.ok),{status:"disetujui",approvedBy:user.uid,approvedByEmail:user.email||"",approvedAt:serverTimestamp(),updatedAt:serverTimestamp()}));list.querySelectorAll("[data-no]").forEach(b=>b.onclick=()=>updateDoc(doc(db,"orderMember",b.dataset.no),{status:"ditolak",updatedAt:serverTimestamp()}))}</script></main></body></html>
