<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FIXZY | Approval Order Member Baru</title>
<style>
*{box-sizing:border-box}
:root{--black:#0b0f14;--yellow:#ffc107;--bg:#eef2f6;--green:#16a34a;--red:#dc2626}
html,body{margin:0;padding:0;font-family:Arial,sans-serif;background:var(--bg);color:#111827}
header{position:sticky;top:0;z-index:10;background:var(--black);color:#fff;border-bottom:3px solid var(--yellow)}
.head{max-width:1100px;margin:auto;padding:12px;display:flex;align-items:center;gap:12px}
.logo{width:48px;height:48px;border-radius:12px;background:#000;object-fit:contain}
.headtext{flex:1}.headtext h1{margin:0;font-size:18px}.email{font-size:11px;color:#9ca3af}
.btn{border:2px solid #111827;border-radius:9px;padding:9px 12px;font-weight:900;cursor:pointer;background:#fff;box-shadow:2px 2px 0 #111827}
main{max-width:1100px;margin:auto;padding:18px 12px}
.card{background:#fff;border:2px solid #111827;border-radius:12px;padding:14px;margin-bottom:14px;box-shadow:4px 4px 0 #111827}
.title{font-weight:900;font-size:16px;border-bottom:2px solid #111827;padding-bottom:9px;margin-bottom:12px}
.notice{font-size:12px;font-weight:800;color:#64748b;margin-bottom:10px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:11px;font-weight:900;margin-bottom:5px}
input,select{width:100%;padding:10px;border:2px solid #111827;border-radius:8px;background:#fff;font:inherit}
.employee-list{display:flex;gap:8px;overflow:auto;padding:4px 1px 8px}
.employee{flex:0 0 auto;background:#fff;border:2px solid #111827;border-radius:9px;padding:9px 13px;font-weight:900;cursor:pointer;box-shadow:2px 2px 0 #111827}
.employee.active{background:var(--yellow)}
.order{border:2px solid #111827;border-radius:12px;margin-top:12px;overflow:hidden}
.orderhead{padding:12px;background:#f8fafc;border-bottom:2px solid #111827}
.row{display:flex;justify-content:space-between;gap:10px}
.orderbody{padding:12px}.member{font-weight:900}.meta{font-size:12px;line-height:1.7;color:#475569}
.items{margin-top:10px;border:2px solid #111827;border-radius:8px;overflow:hidden}
.item{padding:9px;border-bottom:1px solid #e5e7eb}.item:last-child{border:0}
.summary{margin-top:10px;padding:10px;border:2px solid #111827;border-radius:8px;background:#fffbeb;line-height:1.8;font-size:12px}
.badge{display:inline-block;border:1px solid #f59e0b;background:#fef3c7;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:900}
.empty{text-align:center;padding:28px;color:#64748b;font-weight:800;font-size:12px}
.ok{color:var(--green)}.err{color:var(--red)}
@media(max-width:650px){.filters{grid-template-columns:1fr}.headtext h1{font-size:16px}}
</style>
</head>
<body>
<header>
 <div class="head">
  <img class="logo" src="logo.png" onerror="this.style.display='none'" alt="FIXZY">
  <div class="headtext"><h1>Approval Order Member</h1><div id="email" class="email">-</div></div>
  <button class="btn" onclick="location.reload()">↻ Refresh</button>
 </div>
</header>

<main>
 <div id="notice" class="card notice">Memuat sesi FIXZY...</div>

 <section class="card">
  <div class="title">👨‍🔧 Pilih Employee / Karyawan</div>
  <div class="notice">Daftar employee diambil langsung dari <b>users</b> milik Owner yang sedang login.</div>
  <div id="employees" class="employee-list"></div>
 </section>

 <section class="card">
  <div class="title">📋 Order Menunggu Approval</div>
  <div id="orders"><div class="empty">Pilih employee terlebih dahulu.</div></div>
 </section>
</main>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import{getFirestore,collection,query,where,getDocs}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyC_PcarMTT5Un7qfSLzf92o5OGn5rginsI",
 authDomain:"fixzy-update.firebaseapp.com",
 projectId:"fixzy-update",
 storageBucket:"fixzy-update.firebasestorage.app",
 messagingSenderId:"995892519622",
 appId:"1:995892519622:web:fa41047944d8e5b35d6dc7"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let currentUid="";
let ownerUid="";
let employees=[];
let orders=[];
let selectedEmployee=null;

const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rupiah=v=>"Rp "+(Number(v)||0).toLocaleString("id-ID");

function notice(text,cls=""){
 $("notice").textContent=text;
 $("notice").className="card notice "+cls;
}

function nameOfEmployee(x){
 return String(x.namaKaryawan||x.nama||x.displayName||x.name||x.email||"").trim();
}

/*
 * LOAD EMPLOYEE BARU
 * Satu sumber utama: users
 * ownerUid wajib sama dengan ownerUid akun Owner.
 */
async function loadEmployees(){
 employees=[];
 const map=new Map();

 const snap=await getDocs(
   query(collection(db,"users"),where("ownerUid","==",ownerUid))
 );

 snap.forEach(docSnap=>{
   const x=docSnap.data()||{};
   const role=String(x.role||x.profileRole||"").trim().toLowerCase();

   if(!["employee","karyawan","pegawai","teknisi"].includes(role)) return;

   const uid=String(x.uid||docSnap.id).trim();
   const nama=nameOfEmployee(x);
   if(!uid||!nama)return;

   map.set(uid,{
     uid,
     nama,
     kode:String(x.kodeKaryawan||x.kode||x.employeeCode||"").trim(),
     role
   });
 });

 employees=[...map.values()].sort((a,b)=>a.nama.localeCompare(b.nama,"id"));

 renderEmployees();
}

function renderEmployees(){
 const box=$("employees");

 if(!employees.length){
   box.innerHTML='<div class="empty">Employee tidak ditemukan pada users milik Owner ini.</div>';
   return;
 }

 box.innerHTML=employees.map((e,i)=>`
   <button class="employee ${selectedEmployee?.uid===e.uid?"active":""}" data-uid="${esc(e.uid)}">
     ${esc(e.nama)}${e.kode?" — "+esc(e.kode):""}
   </button>
 `).join("");

 box.querySelectorAll(".employee").forEach(btn=>{
   btn.onclick=()=>{
     const e=employees.find(x=>x.uid===btn.dataset.uid);
     if(!e)return;
     selectedEmployee=e;
     renderEmployees();
     renderOrders();
   };
 });
}

/*
 * LOAD ORDER
 * Order dicari berdasarkan owner terlebih dahulu.
 * Setelah itu dicocokkan dengan UID employee.
 * Tidak membuat employee dari data order.
 */
async function loadOrders(){
 orders=[];
 const map=new Map();

 for(const field of ["ownerUid","ownerId"]){
   try{
     const snap=await getDocs(
       query(collection(db,"penjualan"),where(field,"==",ownerUid))
     );

     snap.forEach(d=>{
       const x={id:d.id,...d.data()};
       const status=String(x.status||x.approvalStatus||"").toLowerCase();

       if(!["menunggu_approval","pending","menunggu approval"].includes(status))return;

       if(!map.has(d.id))map.set(d.id,x);
     });
   }catch(e){
     console.warn("Load order "+field,e);
   }
 }

 orders=[...map.values()];
}

function employeeUidFromOrder(o){
 const k=o.karyawan;
 const e=o.employee;

 if(k&&typeof k==="object")
   return String(k.uid||k.userUid||k.id||"").trim();

 if(e&&typeof e==="object")
   return String(e.uid||e.userUid||e.id||"").trim();

 return String(
   o.karyawanUid||
   o.employeeUid||
   o.employeeId||
   ""
 ).trim();
}

function employeeNameFromOrder(o){
 const k=o.karyawan;
 const e=o.employee;

 if(typeof k==="string")return k.trim();
 if(k&&typeof k==="object")return String(k.namaKaryawan||k.nama||k.name||"").trim();

 if(typeof e==="string")return e.trim();
 if(e&&typeof e==="object")return String(e.namaKaryawan||e.nama||e.name||"").trim();

 return String(o.karyawanNama||o.namaKaryawan||o.employeeName||"").trim();
}

function itemsOf(o){
 return Array.isArray(o.items)?o.items:
        Array.isArray(o.produkList)?o.produkList:[];
}

function renderOrders(){
 const box=$("orders");

 if(!selectedEmployee){
   box.innerHTML='<div class="empty">Pilih employee terlebih dahulu.</div>';
   return;
 }

 const uid=selectedEmployee.uid.toLowerCase();

 const list=orders.filter(o=>{
   const euid=employeeUidFromOrder(o).toLowerCase();
   return euid===uid;
 });

 if(!list.length){
   box.innerHTML=`<div class="empty">Tidak ada order menunggu approval untuk ${esc(selectedEmployee.nama)}.</div>`;
   return;
 }

 box.innerHTML=list.map(renderOrder).join("");
}

function renderOrder(o){
 const items=itemsOf(o);
 const nota=o.nomorNota||o.id;
 const member=o.member||o.pelanggan||{};
 let totalQty=0,total=0;

 const itemHtml=items.map((x,i)=>{
   const qty=Number(x.qty||x.jumlah||0)||0;
   const harga=Number(x.harga||x.hargaJual||x.hargaMemberPerPcs||0)||0;
   const jumlah=Number(x.total||x.totalTagihanItem||harga*qty)||0;
   totalQty+=qty; total+=jumlah;

   return `<div class="item">
     <b>${i+1}. ${esc(x.nama||x.namaProduk||"-")}</b><br>
     <span class="meta">Kode: ${esc(x.kode||x.kodeProduk||"-")} • Qty: <b>${qty} pcs</b> • ${rupiah(harga)}/pcs</span>
   </div>`;
 }).join("");

 return `<article class="order">
   <div class="orderhead">
     <div class="row">
       <div>
         <b>${esc(nota)}</b>
         <div class="meta">Employee: ${esc(employeeNameFromOrder(o)||selectedEmployee.nama)}</div>
       </div>
       <span class="badge">MENUNGGU APPROVAL</span>
     </div>
   </div>
   <div class="orderbody">
     <div class="member">👤 ${esc(member.nama||o.memberNama||"Member")}</div>
     <div class="meta">Order ID: ${esc(o.orderMemberId||o.id||"-")}</div>
     <div class="items">${itemHtml||'<div class="empty">Tidak ada produk.</div>'}</div>
     <div class="summary">
       📦 Total Produk: <b>${totalQty} pcs</b><br>
       💰 Total Order: <b>${rupiah(Number(o.total||o.subtotal||total))}</b><br>
       📅 Jatuh Tempo: <b>${esc(o.jatuhTempo||o.tanggalJatuhTempo||"-")}</b>
     </div>
   </div>
 </article>`;
}

async function start(u){
 currentUid=u.uid;
 $("email").textContent=u.email||"-";

 const me=await getDocs(
   query(collection(db,"users"),where("uid","==",currentUid))
 );

 let profile=null;
 me.forEach(d=>{if(!profile)profile=d.data()||{};});

 if(!profile){
   // fallback dokumen users/{uid}
   const {getDoc,doc}=await import("https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js");
   const d=await getDoc(doc(db,"users",currentUid));
   if(d.exists())profile=d.data()||{};
 }

 const role=String(profile?.role||"").trim().toLowerCase();
 if(role!=="owner"){
   notice("Akses hanya untuk Owner.","err");
   return;
 }

 ownerUid=String(profile.ownerUid||profile.ownerId||currentUid).trim();
 if(!ownerUid)throw Error("ownerUid tidak ditemukan.");

 await loadEmployees();
 await loadOrders();

 notice("Employee dan order berhasil dimuat dari Firebase.","ok");
}

onAuthStateChanged(auth,u=>{
 if(!u){
   notice("Sesi Firebase tidak ditemukan. Silakan login dari halaman utama FIXZY.","err");
   return;
 }
 start(u).catch(e=>{
   console.error(e);
   notice("Gagal memuat data: "+(e?.message||e),"err");
 });
});
</script>
</body>
</html>
