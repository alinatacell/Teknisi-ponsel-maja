<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FIXZY | Data Tabungan Member</title><style>body{margin:0;background:#eef2f6;color:#111827;font-family:Arial,sans-serif}header{height:70px;background:#0b0f14;color:#fff;border-bottom:3px solid #ffc107;display:flex;align-items:center}.head{max-width:1100px;width:100%;margin:auto;padding:0 12px;display:flex;align-items:center;gap:12px}.logo{width:50px;height:50px;object-fit:contain}.hi{flex:1}.hi h1{margin:0;font-size:18px}.email{font-size:11px;color:#9ca3af}main{max-width:1100px;margin:auto;padding:18px 12px}.card{background:#fff;border:2px solid #111827;border-radius:12px;padding:14px;margin-bottom:14px;box-shadow:4px 4px 0 #111827}.title{font-weight:900;font-size:16px;border-bottom:2px solid #111827;padding-bottom:8px;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{border:2px solid #111827;border-radius:10px;padding:12px}.metric b{display:block;font-size:20px;margin-top:4px}.table{overflow:auto;border:2px solid #111827;border-radius:9px}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:9px;border-bottom:1px solid #ddd;text-align:left;font-size:11px}th{background:#111827;color:#fff}td.num{text-align:right;font-weight:800}.empty{text-align:center;padding:25px;color:#64748b}.ok{color:#15803d}.err{color:#dc2626}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:500px){.grid{grid-template-columns:1fr}}</style></head><body><header><div class="head"><img class="logo" src="logo.png"><div class="hi"><h1>Data Tabungan Member</h1><span id="email" class="email">-</span></div></div></header><main><div id="notice" class="card">Menunggu akun...</div><div class="card"><div class="title">REKAP TABUNGAN MEMBER</div><div class="grid"><div class="metric">TOTAL MEMBER<b id="memberCount">0</b></div><div class="metric">TOTAL TABUNGAN<b id="totalSave">Rp 0</b></div><div class="metric">TOTAL PENGAMBILAN<b id="totalOut">Rp 0</b></div><div class="metric">SALDO TABUNGAN<b id="totalBalance">Rp 0</b></div></div></div><div class="card"><div class="title">SALDO PER MEMBER</div><div class="table"><table><thead><tr><th>Nama Member</th><th>Email</th><th>Tabungan/Pcs</th><th>Qty Order</th><th>Total Menabung</th><th>Pengambilan</th><th>Saldo Tabungan</th></tr></thead><tbody id="tbody"><tr><td colspan="7" class="empty">Memuat...</td></tr></tbody></table></div></div></main><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";import{getFirestore,collection,query,where,getDocs,getDoc,doc}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";const cfg={apiKey:"AIzaSy_C_PcarMTT5Un7qfSLzf92o5OGn5rginsI",authDomain:"fixzy-update.firebaseapp.com",projectId:"fixzy-update",storageBucket:"fixzy-update.firebasestorage.app",messagingSenderId:"995892519622",appId:"1:995892519622:web:fa41047944d8e5b35d6dc7"};const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);const $=id=>document.getElementById(id),rp=n=>"Rp "+(Number(n)||0).toLocaleString("id-ID"),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));let uid="",ownerUid="",profile={};function ownerOf(d){const r=String(d.role||"").toLowerCase();return r==="owner"||r==="superadmin"?uid:String(d.ownerUid||d.ownerId||uid)}function isCash(r){return [r.jenisHarga,r.tipeOrder,r.tipeTransaksi].map(v=>String(v??"").toLowerCase()).some(v=>["cash","tunai","member_cash"].includes(v))}async function readCol(name,fields){const map=new Map();for(const f of fields){try{const s=await getDocs(query(collection(db,name),where(f,"==",f==="uid"?uid:ownerUid)));s.forEach(d=>map.set(d.id,{id:d.id,...d.data()}))}catch{}}return [...map.values()]}function items(r){return(Array.isArray(r.items)?r.items:Array.isArray(r.produkList)?r.produkList:[]).map(x=>({qty:Number(x.qty||x.jumlah||0)||0,tab:Number(x.tabunganPerPcs??r.tabunganPerPcs??0)||0}))}async function load(){const accounts=await readCol("users",["ownerUid"]);const members=accounts.filter(a=>["employee","reseller","karyawan"].includes(String(a.role||"").toLowerCase()));const orders=await readCol("order_member",["ownerUid","ownerId"]);const exps=await readCol("pengeluaran",["ownerUid","ownerId"]);const by=new Map();members.forEach(m=>by.set(m.id,{...m,qty:0,total:0,out:0}));for(const o of orders){const m=o.member||o.pelanggan||{};const key=String(o.createdBy||o.memberUid||m.uid||m.email||"");let row=by.get(key);if(!row){row=[...by.values()].find(x=>String(x.email||"").toLowerCase()===String(m.email||"").toLowerCase()||String(x.nama||"").toLowerCase()===String(m.nama||"").toLowerCase())}if(!row)continue;items(o).forEach(x=>{row.qty+=x.qty;row.total+=x.qty*x.tab})}for(const e of exps){if(String(e.jenis||"")!=="Pengambilan Tabungan Member")continue;const key=String(e.memberId||"");const row=by.get(key);if(row)row.out+=Number(e.nominal)||0}const arr=[...by.values()];$("memberCount").textContent=arr.length;$("totalSave").textContent=rp(arr.reduce((a,x)=>a+x.total,0));$("totalOut").textContent=rp(arr.reduce((a,x)=>a+x.out,0));$("totalBalance").textContent=rp(arr.reduce((a,x)=>a+x.total-x.out,0));$("tbody").innerHTML=arr.map(x=>`<tr><td><b>${esc(x.nama||x.namaKaryawan||x.name||"-")}</b></td><td>${esc(x.email||"-")}</td><td class="num">${rp(x.tabunganPerPcs??x.tabunganMember??0)}</td><td class="num">${x.qty.toLocaleString("id-ID")}</td><td class="num">${rp(x.total)}</td><td class="num">${rp(x.out)}</td><td class="num"><b>${rp(x.total-x.out)}</b></td></tr>`).join("")||'<tr><td colspan="7" class="empty">Belum ada data tabungan member.</td></tr>'}onAuthStateChanged(auth,async u=>{if(!u){$("notice").textContent="Belum login.";$("notice").className="card err";return}uid=u.uid;const s=await getDoc(doc(db,"users",uid));if(!s.exists())throw Error("Profil akun tidak ditemukan.");profile=s.data()||{};ownerUid=ownerOf(profile);$("email").textContent=u.email||"-";try{await load();$("notice").textContent="✓ Data tabungan tersinkron dari akun Member, order_member, dan pengeluaran.";$("notice").className="card ok"}catch(e){$("notice").textContent="Gagal memuat: "+e.message;$("notice").className="card err"}});</script></body></html>
