<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#FFC107">
<title>FIXZY - Kredit Antar Member</title>
<style>

@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}

.member-note{font-size:11px;color:#6b7280;padding:10px 12px;line-height:1.5}
</style>
</head>
<body>
<header class="header">
  <button class="menu-btn" onclick="bukaMenu()" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>
  <div class="header-running">
    <div class="running-track">
      <span>🤝 Kredit Antar Member FIXZY</span>
      <span>📦 Order Member</span>
      <span>🔒 Sistem menggunakan akun FIXZY</span>
    </div>
  </div>
  <div class="header-account">
    <div class="account-name" id="accountName">Memuat...</div>
    <div class="account-exp">Exp: <span id="accountExp">-</span></div>
  </div>
</header>

<div class="content" id="contentArea"></div>
<div class="overlay" id="overlay" onclick="tutupMenu()"></div>

<aside class="menu" id="menu">
  <div class="menu-head">
    <img src="../logo.png?v=2" alt="FIXZY">
    <div>
      <div class="menu-title">Kredit Antar Member</div>
      <div class="menu-sub">Menu khusus order member</div>
    </div>
    <button class="close" onclick="tutupMenu()">×</button>
  </div>

  <nav class="menu-list">
    <button class="menu-link" onclick="refreshIndex()">
      <span class="ico">🔄</span>Refresh Halaman
    </button>

    <div class="menu-section">ORDER MEMBER</div>

    <button class="menu-link" data-page="input-order-member.html" data-roles="owner,employee,karyawan" onclick="bukaHalaman(this)">
      <span class="ico">📝</span>Input Pesanan Member
    </button>

    <button class="menu-link" data-page="data-order-member.html" data-roles="owner,employee,karyawan" onclick="bukaHalaman(this)">
      <span class="ico">📋</span>Data Order Member
    </button>

    <button class="menu-link" data-page="approval-order-member.html" data-roles="owner" onclick="bukaHalaman(this)">
      <span class="ico">✅</span>Approval Order Member
    </button>

    <div class="menu-section">STOCK MEMBER</div>

    <button class="menu-link" data-page="input-stok-member.html" data-roles="owner" onclick="bukaHalaman(this)">
      <span class="ico">📦</span>Input Stok Member
    </button>

    <button class="menu-link" data-page="stock-member.html" data-roles="owner,employee,karyawan" onclick="bukaHalaman(this)">
      <span class="ico">📦</span>Stock Member
    </button>

    <div class="member-note">
      Owner FIXZY = Pengelola.<br>
      Karyawan/employee FIXZY = Anggota.<br>
      Login dan akun tetap menggunakan Firebase FIXZY.
    </div>

    <div class="menu-section">LAINNYA</div>
    <button class="menu-link" onclick="kembaliFixzy()">
      <span class="ico">↩️</span>Kembali ke FIXZY
    </button>
    <button class="menu-link logout-link" onclick="logoutFixzy()">
      <span class="ico">🚪</span>Logout
    </button>
  </nav>
</aside>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const cfg={apiKey:"AIzaSyC_PcarMTT5Un7qfSLzf92o5OGn5rginsI",authDomain:"fixzy-update.firebaseapp.com",projectId:"fixzy-update",storageBucket:"fixzy-update.firebasestorage.app",messagingSenderId:"995892519622",appId:"1:995892519622:web:fa41047944d8e5b35d6dc7"};
const app=initializeApp(cfg);
const auth=getAuth(app);
const db=getFirestore(app);

let authReady=false;
window.fixzySession={};

function formatExp(v){
  if(!v)return "-";
  try{
    let d=null;
    if(typeof v==="object"&&typeof v.toDate==="function")d=v.toDate();
    else if(typeof v==="object"&&v.seconds!==undefined)d=new Date(Number(v.seconds)*1000);
    else d=new Date(v);
    return d&&!isNaN(d.getTime())?d.toLocaleDateString("id-ID",{day:"2-digit",month:"2-digit",year:"numeric"}):"-";
  }catch(e){return "-";}
}

function normalisasiIzin(raw){
  if(!raw)return {};
  if(typeof raw==="object"&&!Array.isArray(raw))return raw;
  if(Array.isArray(raw)){const o={};raw.forEach(k=>o[k]=true);return o;}
  return {};
}

function roleDiizinkan(btn,role){
  const roles=String(btn.dataset.roles||"").split(",").map(x=>x.trim().toLowerCase()).filter(Boolean);
  if(!roles.length)return true;
  const r=String(role||"").toLowerCase();
  if(r==="admin"||r==="superadmin")return true;
  if(r==="employee"&&roles.includes("karyawan"))return true;
  if(r==="karyawan"&&roles.includes("employee"))return true;
  return roles.includes(r);
}

function terapkanHakAkses(){
  const role=String(window.fixzySession.role||"").toLowerCase();
  document.querySelectorAll(".menu-link[data-page]").forEach(btn=>{
    const ok=roleDiizinkan(btn,role);
    btn.style.display=ok?"":"none";
  });
}

function bukaMenu(){menu.classList.add("show");overlay.classList.add("show")}
function tutupMenu(){menu.classList.remove("show");overlay.classList.remove("show")}
window.bukaMenu=bukaMenu;window.tutupMenu=tutupMenu;

function refreshIndex(){location.reload()}
window.refreshIndex=refreshIndex;

function tampilkanBeranda(){
  contentArea.innerHTML=`<div style="height:100%;display:flex;align-items:center;justify-content:center;padding:20px;background:#f3f4f6">
    <div style="width:min(460px,100%);background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:24px;text-align:center;box-shadow:0 5px 20px #0001">
      <div style="font-size:44px">🤝</div>
      <h2 style="margin:10px 0 7px">Kredit Antar Member</h2>
      <p style="margin:0;color:#667085;font-size:13px;line-height:1.6">Pilih menu di sebelah kiri untuk input order, melihat data order, approval, atau mengelola stock member.</p>
    </div>
  </div>`;
}

function bukaHalaman(btn){
  if(!authReady||!auth.currentUser){location.href="../login.html";return}
  if(!roleDiizinkan(btn,window.fixzySession.role))return;
  const frame=document.createElement("iframe");
  frame.title="Halaman Kredit Antar Member";
  frame.src=btn.dataset.page;
  frame.style.cssText="width:100%;height:100%;border:0;display:block;background:#fff;position:relative;z-index:1";
  contentArea.innerHTML="";
  contentArea.appendChild(frame);
  document.querySelectorAll(".menu-link").forEach(x=>x.classList.remove("active"));
  btn.classList.add("active");
  tutupMenu();
}
window.bukaHalaman=bukaHalaman;

function kembaliFixzy(){location.href="../index.html"}
window.kembaliFixzy=kembaliFixzy;

function logoutFixzy(){
  signOut(auth).finally(()=>location.href="../login.html");
}
window.logoutFixzy=logoutFixzy;

async function validasi(user){
  if(!user){location.href="../login.html";return}
  try{
    const snap=await getDoc(doc(db,"users",user.uid));
    if(!snap.exists()){await signOut(auth);location.href="../login.html";return}
    const data=snap.data()||{};
    const role=String(data.role||"").toLowerCase();
    const allowed=["owner","employee","karyawan","admin","superadmin"];
    if(!allowed.includes(role)){await signOut(auth);location.href="../login.html";return}
    if(["blocked","rejected"].includes(String(data.status||"").toLowerCase())){await signOut(auth);location.href="../login.html";return}
    window.fixzySession={
      uid:user.uid,
      role:role,
      ownerUid:role==="owner"?user.uid:(data.ownerUid||data.ownerId||""),
      profile:data,
      permissions:normalisasiIzin(data.izin??data.permissions??data.hakAkses??data.access)
    };
    accountName.textContent=data.namaKonter||data.namaPemilik||data.nama||user.email||"Akun";
    accountExp.textContent=formatExp(data.exp||data.expAt||data.expiredAt||data.tanggalBerakhir);
    authReady=true;
    terapkanHakAkses();
    tampilkanBeranda();
  }catch(e){
    console.error(e);
    await signOut(auth).catch(()=>{});
    location.href="../login.html";
  }
}

onAuthStateChanged(auth,validasi);
</script>
</body>
</html>
