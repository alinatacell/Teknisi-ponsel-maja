<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FIXZY | Reload Stok Member</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f6;color:#111827;font-family:Arial,sans-serif}
header{height:72px;background:#0b0f14;color:#fff;border-bottom:3px solid #ffc107;display:flex;align-items:center}
.head{width:100%;max-width:920px;margin:auto;padding:0 12px;display:flex;align-items:center;gap:12px}
.logo{width:48px;height:48px;object-fit:contain;background:#000;border-radius:12px;padding:4px}.hi{flex:1}.hi b{font-size:18px}.hi small{display:block;color:#9ca3af;margin-top:3px;font-weight:700}
main{max-width:920px;margin:auto;padding:18px 12px}.card{background:#fff;border:2px solid #111827;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:4px 4px 0 #111827}
.title{font-weight:900;font-size:16px;border-bottom:2px solid #111827;padding-bottom:9px;margin-bottom:12px}
label{display:block;font-size:12px;font-weight:900;margin-bottom:5px}input{width:100%;padding:11px;border:2px solid #111827;border-radius:8px;font:inherit}
button{border:2px solid #111827;border-radius:9px;padding:11px 14px;font-weight:900;cursor:pointer;box-shadow:3px 3px 0 #111827}
.primary{background:#ffc107}.secondary{background:#e5e7eb}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.notice{font-size:12px;font-weight:800;line-height:1.6}.ok{color:#15803d}.err{color:#dc2626}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat div{border:2px solid #111827;border-radius:9px;padding:12px;text-align:center}.stat b{display:block;font-size:20px}.stat span{font-size:10px;font-weight:800;color:#64748b}
@media(max-width:600px){.actions{grid-template-columns:1fr}.stat{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><div class="head"><img class="logo" src="logo.png" onerror="this.style.display='none'"><div class="hi"><b>Reload Stok Member</b><small>SUMBER DATA: GOOGLE SPREADSHEET</small></div></div></header>
<main>
<div class="card">
<div class="title">Sumber Spreadsheet</div>
<label>URL / CSV GOOGLE SHEETS</label>
<input id="sheetUrl" placeholder="Tempel URL CSV Google Sheets di sini">
<div class="notice" style="margin-top:8px">Gunakan URL publik/export CSV dari spreadsheet stok. Halaman ini tidak menggunakan Firebase.</div>
</div>
<div class="card">
<div class="title">Reload Stok</div>
<div class="actions">
<button class="primary" id="reload">↻ RELOAD STOK</button>
<button class="secondary" id="open">▣ BUKA HALAMAN STOK MEMBER</button>
</div>
<div id="msg" class="notice" style="margin-top:12px">Belum ada proses.</div>
</div>
<div class="card">
<div class="title">Hasil Sinkronisasi Lokal</div>
<div class="stat">
<div><b id="count">0</b><span>PRODUK</span></div>
<div><b id="time">-</b><span>TERAKHIR RELOAD</span></div>
<div><b id="size">0 KB</b><span>DATA CACHE</span></div>
</div>
</div>
</main>
<script>
const KEY="FIXZY_STOK_MEMBER_SPREADSHEET_V1";
const URLKEY="FIXZY_STOK_MEMBER_SHEET_URL";
const $=id=>document.getElementById(id);
$("sheetUrl").value=localStorage.getItem(URLKEY)||"";
function message(t,c=""){ $("msg").textContent=t;$("msg").className="notice "+c }
function parseCSV(s){
 const rows=[];let row=[],cell="",q=false;
 for(let i=0;i<s.length;i++){let ch=s[i],nx=s[i+1];
  if(ch=='"'){if(q&&nx=='"'){cell+='"';i++}else q=!q}
  else if(ch==','&&!q){row.push(cell.trim());cell=""}
  else if((ch=='\\n'||ch=='\\r')&&!q){if(ch=='\\r'&&nx=='\\n')i++;row.push(cell.trim());cell="";if(row.some(x=>x!==""))rows.push(row);row=[]}
  else cell+=ch;
 }
 if(cell||row.length){row.push(cell.trim());if(row.some(x=>x!==""))rows.push(row)}
 return rows;
}
function normalize(s){return String(s||"").toLowerCase().replace(/[\\s_\\-./()]/g,"")}
function num(v){return Number(String(v??"").replace(/[^0-9.-]/g,""))||0}
function convert(rows){
 if(rows.length<2) return [];
 const h=rows[0].map(normalize);
 const find=(...names)=>{for(const n of names){let i=h.indexOf(normalize(n));if(i>=0)return i}return -1};
 const ix={
  id:find("id","produkid","kode","kodeproduk"),
  kode:find("kode","kodeproduk","sku"),
  nama:find("nama","namaproduk","produk","product"),
  kategori:find("kategori","category"),
  stok:find("stok","stock","sisa","qty"),
  harga:find("hargajual","harga","hargatempo"),
  modal:find("hargamodal","modal","harga beli"),
  gambar:find("gambar","image","foto","urlgambar")
 };
 return rows.slice(1).map((r,n)=>({
  id:String(ix.id>=0?r[ix.id]:ix.kode>=0?r[ix.kode]:"row-"+(n+2)).trim(),
  kode:String(ix.kode>=0?r[ix.kode]:"").trim(),
  nama:String(ix.nama>=0?r[ix.nama]:"").trim(),
  kategori:String(ix.kategori>=0?r[ix.kategori]:"").trim(),
  stok:num(ix.stok>=0?r[ix.stok]:0),
  harga:num(ix.harga>=0?r[ix.harga]:0),
  modal:num(ix.modal>=0?r[ix.modal]:0),
  gambar:String(ix.gambar>=0?r[ix.gambar]:"").trim()
 })).filter(x=>x.nama||x.kode);
}
async function reload(){
 const u=$("sheetUrl").value.trim();
 if(!u)return message("URL Spreadsheet wajib diisi.","err");
 localStorage.setItem(URLKEY,u);message("Mengambil data dari Spreadsheet...");
 try{
  const res=await fetch(u,{cache:"no-store"});
  if(!res.ok)throw Error("Spreadsheet tidak dapat diakses ("+res.status+").");
  const rows=parseCSV(await res.text()), products=convert(rows);
  if(!products.length)throw Error("Tidak ada produk yang terbaca. Periksa header Spreadsheet.");
  const payload={version:1,source:"spreadsheet",updatedAt:new Date().toISOString(),products};
  localStorage.setItem(KEY,JSON.stringify(payload));
  $("count").textContent=products.length;
  $("time").textContent=new Date().toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"});
  $("size").textContent=Math.max(1,Math.round(JSON.stringify(payload).length/1024))+" KB";
  message("Reload berhasil. "+products.length+" produk tersimpan di cache Spreadsheet Member.","ok");
 }catch(e){message(e.message,"err")}
}
$("reload").onclick=reload;
$("open").onclick=()=>location.href="tampil-stock-member-SPREADSHEET-BARU.html";
(()=>{try{let d=JSON.parse(localStorage.getItem(KEY)||"{}");$("count").textContent=d.products?.length||0;if(d.updatedAt)$("time").textContent=new Date(d.updatedAt).toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"});$("size").textContent=Math.max(0,Math.round((localStorage.getItem(KEY)||"").length/1024))+" KB"}catch{}})();
</script>
</body></html>
