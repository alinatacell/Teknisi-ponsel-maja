<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FIXZY | Stok Member</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f6;color:#111827;font-family:Arial,sans-serif}
header{height:72px;background:#0b0f14;color:#fff;border-bottom:3px solid #ffc107;display:flex;align-items:center}.head{max-width:920px;width:100%;margin:auto;padding:0 12px;display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;background:#000;border-radius:12px;padding:4px;object-fit:contain}.hi{flex:1}.hi b{font-size:18px}.hi small{display:block;color:#9ca3af;font-weight:700;margin-top:3px}
main{max-width:920px;margin:auto;padding:18px 12px}.card{background:#fff;border:2px solid #111827;border-radius:12px;padding:15px;margin-bottom:14px;box-shadow:4px 4px 0 #111827}.bar{display:grid;grid-template-columns:1fr auto auto;gap:8px}input{padding:11px;border:2px solid #111827;border-radius:8px;font:inherit;width:100%}button{border:2px solid #111827;border-radius:8px;padding:10px 12px;font-weight:900;cursor:pointer;box-shadow:2px 2px 0 #111827}.yellow{background:#ffc107}.gray{background:#e5e7eb}.notice{font-size:11px;font-weight:800;color:#64748b;margin-top:9px}
.list{display:grid;gap:9px}.item{background:#fff;border:2px solid #111827;border-radius:10px;padding:11px;display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center}.pic{width:64px;height:64px;border:1px solid #d1d5db;border-radius:8px;object-fit:contain;background:#f8fafc}.name{font-weight:900}.meta{font-size:11px;color:#64748b;margin-top:4px;line-height:1.5}.price{font-weight:900;margin-top:5px}.stock{font-size:11px;font-weight:900;margin-top:3px}.stock.zero{color:#dc2626}.empty{text-align:center;padding:25px;font-weight:800;color:#64748b}
@media(max-width:650px){.bar{grid-template-columns:1fr 1fr}.bar input{grid-column:1/-1}.item{grid-template-columns:54px 1fr}.pic{width:54px;height:54px}.item button{grid-column:2}}
</style>
</head>
<body>
<header><div class="head"><img class="logo" src="logo.png" onerror="this.style.display='none'"><div class="hi"><b>Stok Produk Member</b><small>DATA DARI SPREADSHEET • BELUM KE FIREBASE</small></div></div></header>
<main>
<div class="card"><div class="bar"><input id="q" placeholder="Cari nama / kode produk..."><button class="gray" id="reload">↻ Reload</button><button class="yellow" id="order">🛒 Keranjang / Order</button></div><div id="info" class="notice"></div></div>
<div id="list" class="list"></div>
</main>
<script>
const KEY="FIXZY_STOK_MEMBER_SPREADSHEET_V1",CART="FIXZY_ORDER_MEMBER_PENDING_V1";const $=x=>document.getElementById(x);
let products=[];
function load(){try{let d=JSON.parse(localStorage.getItem(KEY)||"{}");products=Array.isArray(d.products)?d.products:[];$("info").textContent=products.length?`${products.length} produk • update ${new Date(d.updatedAt).toLocaleString("id-ID")}`:"Belum ada data stok. Jalankan Reload Stok.";render()}catch(e){products=[];render()}}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function render(){let q=$("q").value.trim().toLowerCase();let a=products.filter(p=>(p.nama+" "+p.kode+" "+p.kategori).toLowerCase().includes(q));$("list").innerHTML=a.length?a.map((p,i)=>`<div class="item"><img class="pic" src="${esc(p.gambar||"logo.png")}" onerror="this.src='logo.png'"><div><div class="name">${esc(p.nama||"-")}</div><div class="meta">Kode: ${esc(p.kode||"-")} • ${esc(p.kategori||"-")}</div><div class="price">Rp ${Number(p.harga||0).toLocaleString("id-ID")}</div><div class="stock ${p.stok<=0?"zero":""}">Stok: ${p.stok} pcs</div></div><button class="yellow" ${p.stok<=0?"disabled":""} data-i="${products.indexOf(p)}">＋ Tambah</button></div>`).join(""):`<div class="card empty">Produk tidak ditemukan.</div>`}
$("q").oninput=render;
$("list").onclick=e=>{let b=e.target.closest("button[data-i]");if(!b)return;let p=products[Number(b.dataset.i)];if(!p||p.stok<1)return;let c=[];try{c=JSON.parse(localStorage.getItem(CART)||"[]")}catch{};let x=c.find(x=>x.produkId===p.id);if(x)x.qty=Math.min(x.qty+1,p.stok);else c.push({produkId:p.id,nama:p.nama,kode:p.kode,kategori:p.kategori,harga:p.harga,modal:p.modal,stok:p.stok,gambar:p.gambar,qty:1});localStorage.setItem(CART,JSON.stringify(c));alert("Produk masuk keranjang.");};
$("reload").onclick=()=>location.href="reload-stock-member-SPREADSHEET-BARU.html";
$("order").onclick=()=>location.href="order-member-SPREADSHEET-BARU.html";
load();
</script>
</body></html>
