<!DOCTYPE html>
<html lang="id">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Fixzy | Registrasi Akun</title>
<meta name="theme-color" content="#FFC107">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#0d0d0d;background-image:radial-gradient(circle at top,rgba(255,193,7,.18),transparent 60%);color:#fff;min-height:100vh}
.container{width:100%;max-width:430px;margin:auto;padding:20px 15px 40px}
.card{background:#1b1b1b;border-radius:25px;padding:25px;border:1px solid rgba(255,193,7,.15);box-shadow:0 15px 35px rgba(0,0,0,.45)}
.logo-area{text-align:center;margin-bottom:25px}
.logo{width:170px;height:170px;object-fit:contain;padding:10px;border-radius:30px;background:#111;box-shadow:0 0 25px rgba(255,193,7,.35)}
.logo-area h1{margin-top:18px;font-size:28px;font-weight:700;color:#FFC107}
.logo-area p{margin-top:8px;font-size:12px;color:#bdbdbd}
.input-box{margin-bottom:16px}
.input-box label{display:block;margin-bottom:6px;font-size:13px;font-weight:600;color:#FFC107}
.input-box input,.input-box textarea{width:100%;padding:13px;background:#252525;border:1px solid #333;border-radius:12px;font-size:14px;color:#fff;outline:none}
.input-box input:focus,.input-box textarea:focus{border-color:#FFC107}
.input-box textarea{resize:none;min-height:80px}
.field-error{display:none;margin-top:4px;font-size:11px;color:#f87171}
.field-error.show{display:block}
.password{display:flex;align-items:center;background:#252525;border:1px solid #333;border-radius:12px;overflow:hidden}
.password input{border:none;background:transparent;flex:1}
.password button{width:50px;height:48px;border:none;background:#FFC107;color:#111;font-size:18px;cursor:pointer}
.token-box{margin:18px 0;padding:14px;border-radius:14px;background:rgba(255,193,7,.08);border:1px solid rgba(255,193,7,.25)}
.token-picker{position:relative}
.token-input-wrap{display:flex;gap:6px}
.token-input-wrap input{flex:1}
.token-refresh{width:44px;border:0;border-radius:10px;background:#FFC107;color:#111;font-weight:900;cursor:pointer}
.token-picker-list{display:none;position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:50;max-height:260px;overflow-y:auto;background:#181818;border:1px solid #FFC107;border-radius:12px;padding:5px}
.token-picker-list.show{display:block}
.token-option{width:100%;text-align:left;border:0;border-bottom:1px solid #2a2a2a;background:#181818;color:#fff;padding:10px 12px;cursor:pointer;font-family:monospace;font-size:13px}
.token-option:hover{background:rgba(255,193,7,.15);color:#FFC107}
.token-option small{display:block;font-size:9px;color:#888;margin-top:2px;font-family:Poppins}
.token-empty{text-align:center;color:#aaa;font-size:11px;padding:16px}
.check{display:flex;gap:10px;margin:16px 0;font-size:13px;color:#ddd}
.check input{margin-top:3px;accent-color:#FFC107}
#btnDaftar{width:100%;padding:15px;border:none;border-radius:14px;background:linear-gradient(90deg,#FFC107,#FF9800);color:#111;font-size:16px;font-weight:700;cursor:pointer}
#btnDaftar:disabled{opacity:.5}
#loading{display:none;margin-top:12px;text-align:center;color:#FFC107;font-size:13px}
.popup{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);justify-content:center;align-items:center;z-index:9999;padding:15px}
.popup-box{width:90%;max-width:340px;background:#1b1b1b;padding:22px;border-radius:18px;text-align:center;border:1px solid #FFC107}
.popup-box h3{color:#FFC107}
.popup-box p{margin:16px 0;color:#fff;white-space:pre-line;font-size:13px;line-height:1.5}
.popup-box button{padding:10px 28px;border:0;border-radius:10px;background:#FFC107;color:#111;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div class="container"><div class="card">
<div class="logo-area"><img src="logo.png" class="logo" alt="Fixzy"><h1>Registrasi Akun</h1><p>Aktivasi Owner Fixzy dengan token gratis 3 Bulan</p></div>
<form id="registerForm" novalidate>
<div class="input-box"><label>Nama Konter</label><input id="namaKonter" placeholder="Masukkan nama konter" maxlength="60" required><div class="field-error" id="errNamaKonter"></div></div>
<div class="input-box"><label>Nama Pemilik</label><input id="namaPemilik" placeholder="Masukkan nama pemilik" maxlength="60" required><div class="field-error" id="errNamaPemilik"></div></div>
<div class="input-box"><label>No WhatsApp</label><input id="whatsapp" type="tel" placeholder="08xxxxxxxxxx" maxlength="15" inputmode="numeric" required><div class="field-error" id="errWhatsapp"></div></div>
<div class="input-box"><label>Email Login</label><input id="email" type="email" placeholder="email@gmail.com" maxlength="120" required><div class="field-error" id="errEmail"></div></div>
<div class="input-box"><label>Alamat</label><textarea id="alamat" placeholder="Masukkan alamat lengkap" maxlength="250" required></textarea><div class="field-error" id="errAlamat"></div></div>

<div class="input-box token-box">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><label style="margin:0">Token Registrasi Gratis</label><span style="font-size:9px;color:#aaa">90 Hari • Pilih</span></div>
<div class="token-picker" id="tokenPicker">
<div class="token-input-wrap"><input id="tokenAktivasi" placeholder="Klik untuk pilih token tersedia" autocomplete="off" required><button type="button" class="token-refresh" id="btnRefreshToken">↻</button></div>
<div id="tokenPickerList" class="token-picker-list"></div>
</div>
<div class="field-error" id="errToken"></div>
<div style="font-size:10px;color:#aaa;margin-top:6px">Token dibuat dari halaman admin <b>FIXZY ADMIN - TOKEN REGISTRASI</b>. Collection <code>registrationTokens</code> field: token, paketHari=90, used=false</div>
</div>

<div class="input-box"><label>Password</label><div class="password"><input id="password" type="password" placeholder="Minimal 8 karakter" required><button type="button" id="lihatPassword">👁</button></div><div class="field-error" id="errPassword"></div></div>
<div class="input-box"><label>Konfirmasi Password</label><input id="konfirmasiPassword" type="password" placeholder="Ulangi password" required><div class="field-error" id="errKonfirmasi"></div></div>
<label class="check"><input type="checkbox" id="setuju" required><span>Saya menyetujui syarat dan ketentuan penggunaan aplikasi Fixzy.</span></label>
<button id="btnDaftar" type="submit">DAFTAR SEKARANG</button>
<div id="loading">Memproses...</div>
<div style="margin-top:18px;text-align:center;font-size:13px">Sudah punya akun? <a href="login.html" style="color:#FFC107;font-weight:bold;text-decoration:none">Login</a></div>
</form>
</div></div>
<div id="popup" class="popup"><div class="popup-box"><h3 id="popupJudul">Fixzy</h3><p id="popupPesan"></p><button type="button" onclick="tutupPopup()">OK</button></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import { getFirestore, collection, getDocs, query, where, doc, setDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyC_PcarMTT5Un7qfSLzf92o5OGn5rginsI",
  authDomain:"fixzy-update.firebaseapp.com",
  projectId:"fixzy-update",
  storageBucket:"fixzy-update.firebasestorage.app",
  messagingSenderId:"995892519622",
  appId:"1:995892519622:web:fa41047944d8e5b35d6dc7"
};
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

const form=document.getElementById("registerForm");
const btn=document.getElementById("btnDaftar");
const loading=document.getElementById("loading");
const tokenInput=document.getElementById("tokenAktivasi");
const tokenList=document.getElementById("tokenPickerList");
const tokenPicker=document.getElementById("tokenPicker");

let tokenData=[];
let tokenLoaded=false;
let tokenLoading=false;

function popup(j,p){document.getElementById("popupJudul").innerText=j;document.getElementById("popupPesan").innerText=p;document.getElementById("popup").style.display="flex";}
window.tutupPopup=()=>document.getElementById("popup").style.display="none";

function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}

function setErr(id,msg,ok){
  const el=document.getElementById(id.replace("err","err")||id);
  const inputMap={errNamaKonter:"namaKonter",errNamaPemilik:"namaPemilik",errWhatsapp:"whatsapp",errEmail:"email",errAlamat:"alamat",errPassword:"password",errKonfirmasi:"konfirmasiPassword",errToken:"tokenAktivasi"};
  const inp=document.getElementById(inputMap[id]||"");
  if(ok){if(el)el.classList.remove("show"); return true;}
  if(el){el.textContent=msg; el.classList.add("show");}
  return false;
}

function validasi(){
  let ok=true;
  const nk=document.getElementById("namaKonter").value.trim();
  if(nk.length<3){setErr("errNamaKonter","Nama konter minimal 3 karakter"); ok=false;} else setErr("errNamaKonter","",true);
  const np=document.getElementById("namaPemilik").value.trim();
  if(np.length<3){setErr("errNamaPemilik","Nama pemilik minimal 3 karakter"); ok=false;} else setErr("errNamaPemilik","",true);
  let wa=document.getElementById("whatsapp").value.replace(/[^0-9]/g,"");
  document.getElementById("whatsapp").value=wa;
  if(wa.length<10){setErr("errWhatsapp","WA minimal 10 digit"); ok=false;} else setErr("errWhatsapp","",true);
  const em=document.getElementById("email").value.trim().toLowerCase();
  document.getElementById("email").value=em;
  if(!em.includes("@")||!em.includes(".")){setErr("errEmail","Email tidak valid"); ok=false;} else setErr("errEmail","",true);
  const al=document.getElementById("alamat").value.trim();
  if(al.length<5){setErr("errAlamat","Alamat minimal 5 karakter"); ok=false;} else setErr("errAlamat","",true);
  const pw=document.getElementById("password").value;
  if(pw.length<8){setErr("errPassword","Password minimal 8 karakter"); ok=false;} else setErr("errPassword","",true);
  const kp=document.getElementById("konfirmasiPassword").value;
  if(kp!==pw){setErr("errKonfirmasi","Konfirmasi tidak sama"); ok=false;} else setErr("errKonfirmasi","",true);
  const tk=tokenInput.value.trim().toUpperCase();
  if(!tk){setErr("errToken","Token wajib dipilih"); ok=false;} else setErr("errToken","",true);
  if(!document.getElementById("setuju").checked){popup("Fixzy","Setujui syarat & ketentuan"); ok=false;}
  return ok;
}

document.getElementById("lihatPassword").addEventListener("click",()=>{
  const p=document.getElementById("password");
  p.type=p.type==="password"?"text":"password";
});
document.getElementById("whatsapp").addEventListener("input",function(){this.value=this.value.replace(/[^0-9]/g,"").slice(0,15);});

// TOKEN PICKER - sesuaikan dengan admin yang bikin: token, paketHari=90, used=false
async function loadTokens(){
  if(tokenLoading) return;
  tokenLoading=true;
  tokenList.innerHTML='<div class="token-empty">Memuat token...</div>';
  tokenList.classList.add("show");
  try{
    // Coba filter yang tersedia - ini sesuai rules baru
    let snap;
    try{
      snap=await getDocs(query(collection(db,"registrationTokens"), where("used","==",false)));
    }catch{
      snap=await getDocs(collection(db,"registrationTokens"));
    }
    console.log("Total docs:",snap.size);
    const list=[];
    snap.forEach(d=>{
      const data=d.data()||{};
      const t=String(data.token||"").trim();
      if(!t) return;
      if(data.used===true) return;
      const hari=Number(data.paketHari||90);
      // Admin bikin paketHari=90, jadi hanya tampilkan 90 hari
      if(hari!==90 && hari!==3) return;
      list.push({id:d.id, token:t, paket:data.paket||"3 Bulan / 90 Hari", used:!!data.used});
    });
    // dedup
    const map=new Map();
    list.forEach(x=>{if(!map.has(x.token.toUpperCase())) map.set(x.token.toUpperCase(),x);});
    tokenData=[...map.values()].sort((a,b)=>a.token.localeCompare(b.token));
    renderTokens();
  }catch(e){
    console.error(e);
    tokenList.innerHTML='<div class="token-empty">Gagal memuat token: '+(e.message||e.code)+'<br><small>Rules harus allow read where used==false (sudah ada di file rules). Tetap bisa ketik manual.</small></div>';
  }finally{tokenLoading=false;}
}

function renderTokens(){
  const q=tokenInput.value.trim().toUpperCase();
  const filtered=tokenData.filter(t=>!q||t.token.includes(q));
  if(!filtered.length){
    tokenList.innerHTML='<div class="token-empty">Tidak ada token tersedia. Buat dulu di halaman admin.</div>';
    return;
  }
  tokenList.innerHTML=filtered.slice(0,100).map(t=>`<button type="button" class="token-option" data-token="${esc(t.token)}">${esc(t.token)}<small>${esc(t.paket)} • TERSEDIA</small></button>`).join("");
  tokenList.querySelectorAll(".token-option").forEach(b=>{
    b.addEventListener("click",()=>{
      tokenInput.value=b.dataset.token;
      tokenList.classList.remove("show");
      setErr("errToken","",true);
    });
  });
}

tokenInput.addEventListener("focus",()=>{if(!tokenLoaded){loadTokens(); tokenLoaded=true;} else {tokenList.classList.add("show"); renderTokens();}});
tokenInput.addEventListener("click",()=>{if(!tokenLoaded){loadTokens(); tokenLoaded=true;} else {tokenList.classList.add("show"); renderTokens();}});
tokenInput.addEventListener("input",()=>{tokenInput.value=tokenInput.value.toUpperCase(); renderTokens(); tokenList.classList.add("show");});
document.getElementById("btnRefreshToken").addEventListener("click",()=>{tokenLoaded=false; tokenData=[]; loadTokens(); tokenLoaded=true;});
document.addEventListener("click",e=>{if(!tokenPicker.contains(e.target)) tokenList.classList.remove("show");});

// SUBMIT - SESUAIKAN: auth dulu baru cek token (acuan file lama fixzy-f056f)
form.addEventListener("submit",async e=>{
  e.preventDefault();
  if(!validasi()) return;
  const namaKonter=document.getElementById("namaKonter").value.trim();
  const namaPemilik=document.getElementById("namaPemilik").value.trim();
  let whatsapp=document.getElementById("whatsapp").value.replace(/[^0-9]/g,"").trim();
  const email=document.getElementById("email").value.trim().toLowerCase();
  const alamat=document.getElementById("alamat").value.trim();
  const password=document.getElementById("password").value;
  const tokenAktivasi=tokenInput.value.trim().toUpperCase();

  btn.disabled=true;
  loading.style.display="block";
  loading.textContent="Membuat akun...";
  let uid=null;
  try{
    const cred=await createUserWithEmailAndPassword(auth,email,password);
    uid=cred.user.uid;
    console.log("Auth OK",uid);

    loading.textContent="Memeriksa token...";
    let tokenDoc=null, tokenInfo=null;
    try{
      const q=query(collection(db,"registrationTokens"), where("token","==",tokenAktivasi));
      const snap=await getDocs(q);
      snap.forEach(d=>{if(!tokenDoc){tokenDoc=d; tokenInfo=d.data();}});
      if(!tokenDoc) throw new Error("Token tidak ditemukan di registrationTokens. Buat dulu di admin.");
      if(tokenInfo.used===true) throw new Error("Token sudah terpakai.");
    }catch(err){
      throw err;
    }

    const tglAwal=new Date();
    const tglAkhir=new Date(); tglAkhir.setDate(tglAkhir.getDate()+90);
    const konterId="KONTER-"+Date.now();

    await setDoc(doc(db,"users",uid),{
      uid,
      konterId,
      idKonter: konterId,
      konterNama: namaKonter,
      namaKonter,
      namaPemilik,
      whatsapp,
      email,
      akun: email,
      ownerEmail: email,
      alamat,
      aplikasi:"Fixzy",
      paket:"3 Bulan / 90 Hari",
      paketHari:90,
      jenisLisensi:"Token Registrasi",
      durasi:"3 Bulan",
      harga:0,
      status:"aktif",
      role:"owner",
      ownerUid: uid,
      tokenAktivasi,
      tokenId: tokenDoc.id,
      createdAt: serverTimestamp(),
      tanggalDaftar: serverTimestamp(),
      tanggalAktivasi: tglAwal.toISOString(),
      tanggalBerakhir: tglAkhir.toISOString(),
      trialMulai: serverTimestamp(),
      trialSelesai: tglAkhir.toISOString(),
      device: navigator.userAgent,
      versi:"Fixzy V1"
    });

    try{
      await setDoc(doc(db,"konter",konterId),{
        konterId,
        nama: namaKonter,
        namaPemilik,
        ownerEmail: email,
        ownerUid: uid,
        alamat,
        whatsapp,
        email,
        status:"aktif",
        createdAt: serverTimestamp()
      });
    }catch(e){console.warn("konter gagal",e);}

    await updateDoc(doc(db,"registrationTokens",tokenDoc.id),{
      used:true,
      status:"terpakai",
      usedBy: uid,
      usedByEmail: email,
      usedAt: serverTimestamp()
    });

    popup("Berhasil","Pendaftaran berhasil!\nAkun OWNER aktif 90 hari.\nToken "+tokenAktivasi+" sudah terpakai.\nSilakan login.");
    setTimeout(async()=>{try{await signOut(auth);}catch{}; location.href="login.html";},1500);

  }catch(err){
    console.error(err);
    let msg=err.message||"Gagal";
    if(err.code==="auth/email-already-in-use") msg="Email sudah digunakan.";
    if(err.code==="permission-denied") msg="Rules Firestore belum publish. Publish rules di Firebase Console project fixzy-update.\n"+err.message;
    popup("Gagal Registrasi",msg);
    btn.disabled=false;
    loading.style.display="none";
  }
});
</script>

tps:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
