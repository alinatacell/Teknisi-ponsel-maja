<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Data Order Member</title><link rel="stylesheet" href="member.css"></head><body><main class="member-wrap"><div class="member-card"><h1>Data Order Member</h1><input id="search" class="member-input" placeholder="Cari nota, member, WhatsApp"></div><div class="member-card"><div class="member-table-wrap"><table class="member-table"><thead><tr><th>Nota</th><th>Tanggal</th><th>Member</th><th>Rincian</th><th>Total</th><th>Status</th></tr></thead><tbody id="body"></tbody></table></div></div>
<script type="module">import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, onSnapshot, query, orderBy, where, doc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
import {getApps,getApp} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";const auth=getAuth(getApps()[0]||getApp()),db=getFirestore(getApps()[0]||getApp());let all=[];const money=n=>new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(Number(n)||0),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));onAuthStateChanged(auth,u=>{if(!u){location.href="../login.html";return}onSnapshot(query(collection(db,"orderMember"),orderBy("createdAt","desc")),s=>{all=s.docs.map(d=>d.data());render()})});search.oninput=render;function render(){const q=search.value.toLowerCase();const a=all.filter(o=>!q||[o.nomorNota,o.namaMember,o.noWa].join(" ").toLowerCase().includes(q));body.innerHTML=a.map(o=>`<tr><td>${esc(o.nomorNota)}</td><td>${esc(o.tanggal)}</td><td>${esc(o.namaMember)}<br>${esc(o.noWa)}</td><td>${(o.items||[]).map(x=>`${esc(x.name)} × ${x.qty}`).join("<br>")}</td><td>${money(o.total)}</td><td>${esc(o.status)}</td></tr>`).join("")||'<tr><td colspan="6">Belum ada data.</td></tr>'}</script></main></body></html>
