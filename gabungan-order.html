<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FIXZY | Gabungan Produk Belum Approval</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f6;color:#111827;font-family:Arial,sans-serif}header{position:fixed;top:0;left:0;right:0;z-index:10;height:72px;background:#0b0f14;color:#fff;border-bottom:3px solid #ffc107}.head{max-width:900px;height:100%;margin:auto;padding:8px 14px;display:flex;align-items:center;gap:12px}.logo{width:50px;height:50px;border-radius:13px;object-fit:contain;background:#000}.title{flex:1;min-width:0}.title b{display:block;font-size:17px}.title small{color:#9ca3af;font-weight:700}.btn{border:2px solid #334155;border-radius:10px;background:#111827;color:#fff;font-weight:900;padding:10px 13px}.dark{font-size:18px;width:45px}main{max-width:900px;margin:auto;padding:88px 14px 35px}.notice{font-weight:900;color:#64748b;margin:0 0 12px}.ok{color:#15803d}.err{color:#dc2626}.card{background:#fff;border:2px solid #111827;border-radius:15px;padding:15px;margin-bottom:14px;box-shadow:4px 4px 0 #111827}.card h2{margin:0 0 10px;font-size:20px;border-bottom:2px solid #111827;padding-bottom:10px}.desc{color:#64748b;line-height:1.55;font-size:13px}.filters{display:grid;grid-template-columns:1fr 180px;gap:10px;margin-top:14px}label{display:block;font-size:11px;font-weight:900;margin-bottom:5px;color:#475569}input,select{width:100%;padding:12px;border:2px solid #111827;border-radius:10px;font:inherit;background:#fff}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.stat{background:#fff;border:2px solid #111827;border-radius:13px;padding:12px;box-shadow:3px 3px 0 #111827}.stat small{display:block;color:#64748b;font-weight:900;font-size:10px}.stat b{display:block;font-size:21px;margin-top:5px}.product{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 10px;border-bottom:1px solid #dbe2ea}.product:last-child{border-bottom:0}.name{font-size:15px;font-weight:900}.meta{font-size:11px;color:#64748b;margin-top:4px}.qty{font-size:16px;font-weight:900;white-space:nowrap}.wa{width:100%;margin-top:14px;padding:14px;border:2px solid #111827;border-radius:11px;background:#16a34a;color:#fff;font-size:15px;font-weight:900;box-shadow:3px 3px 0 #111827}.empty{text-align:center;padding:35px;color:#64748b}.darkmode{background:#0b1220;color:#e5e7eb}.darkmode .card,.darkmode .stat{background:#111827;color:#e5e7eb;border-color:#475569}.darkmode input,.darkmode select{background:#0f172a;color:#fff;border-color:#475569}.darkmode .product{border-color:#334155}.darkmode .desc,.darkmode label,.darkmode .meta,.darkmode .stat small{color:#94a3b8}.darkmode .card h2{border-color:#475569}@media(max-width:600px){.filters{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:1/-1}.title b{font-size:15px}}
</style>
</head>
<body>
<header><div class="head"><img class="logo" src="logo.png" alt="FIXZY"><div class="title"><b>Gabungan Produk</b><small id="email">-</small></div><button class="btn" onclick="load()">↻ Refresh</button><button id="dark" class="btn dark">🌙</button></div></header>
<main>
<div id="notice" class="notice">Menghubungkan akun FIXZY...</div>
<div class="card"><h2>ORDER PRODUK — BELUM APPROVAL</h2><div class="desc">Semua produk dari seluruh order member yang masih menunggu approval digabung menjadi satu daftar. Produk yang sama dijumlahkan qty-nya. Halaman ini hanya menampilkan <b>Brand / Tipe / Merk / Qty</b>.</div><div class="filters"><div><label>CARI BRAND / TIPE / MERK</label><input id="search" placeholder="Ketik pencarian..."></div><div><label>URUTKAN</label><select id="sort"><option value="name">Nama A-Z</option><option value="qty">Qty terbesar</option></select></div></div></div>
<div id="stats" class="stats"></div>
<div class="card"><h2>DAFTAR PRODUK</h2><div id="list"><div class="empty">Memuat...</div></div><button class="wa" onclick="sendWA()">📲 Kirim Order ke WhatsApp</button></div>
</main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import{getFirestore,collection,query,where,getDocs,getDoc,doc}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyC_PcarMTT5Un7qfSLzf92o5OGn5rginsI",authDomain:"fixzy-update.firebaseapp.com",projectId:"fixzy-update",storageBucket:"fixzy-update.firebasestorage.app",messagingSenderId:"995892519622",appId:"1:995892519622:web:fa41047944d8e35b5d6dc7"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);let uid="",ownerUid="",rows=[];
const $=id=>document.getElementById(id);const esc=s=>String(s??"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function notice(t,c=""){ $("notice").textContent=t;$("notice").className="notice "+c }
function ownerOf(p){const r=String(p.role||"").toLowerCase();if(r==="owner"||r==="superadmin")return uid;return String(p.ownerUid||p.ownerId||"").trim()||uid}
function getItems(r){const a=Array.isArray(r.items)?r.items:(Array.isArray(r.produkList)?r.produkList:[]);return a.map(x=>({brand:String(x.brand||x.namaBrand||x.brands||"").trim(),tipe:String(x.tipe||x.type||x.model||x.namaTipe||x.namaProduk||x.nama||"").trim(),merk:String(x.merk||x.merek||"").trim(),qty:Number(x.qty??x.jumlah??1)||0})).filter(x=>x.qty>0)}
function aggregate(){const m=new Map();for(const r of rows){for(const x of getItems(r)){const brand=x.brand||"-",tipe=x.tipe||"-",merk=x.merk||"-";const key=[brand,tipe,merk].map(v=>v.toLowerCase().replace(/\s+/g," ")).join("|");if(!m.has(key))m.set(key,{brand,tipe,merk,qty:0});m.get(key).qty+=x.qty}}return [...m.values()]}
function label(x){return [x.brand!=="-"?x.brand:"",x.tipe!=="-"?x.tipe:"",x.merk!=="-"?x.merk:""].filter(Boolean).join(" / ")||"Produk"}
function render(){let p=aggregate();const q=$("search").value.trim().toLowerCase();if(q)p=p.filter(x=>label(x).toLowerCase().includes(q));if($("sort").value==="qty")p.sort((a,b)=>b.qty-a.qty);else p.sort((a,b)=>label(a).localeCompare(label(b),"id"));const all=aggregate(),total=all.reduce((s,x)=>s+x.qty,0);$("stats").innerHTML=`<div class="stat"><small>ORDER BELUM APPROVAL</small><b>${rows.length}</b></div><div class="stat"><small>JENIS PRODUK</small><b>${all.length}</b></div><div class="stat"><small>TOTAL QTY</small><b>${total.toLocaleString("id-ID")} pcs</b></div>`;$("list").innerHTML=p.length?p.map((x,i)=>`<div class="product"><div><div class="name">${i+1}. ${esc(label(x))}</div><div class="meta">Brand: ${esc(x.brand)} • Tipe: ${esc(x.tipe)} • Merk: ${esc(x.merk)}</div></div><div class="qty">${x.qty.toLocaleString("id-ID")} pcs</div></div>`).join(""):"<div class=\"empty\">Tidak ada produk yang menunggu approval.</div>"}
async function load(){if(!ownerUid)return notice("Owner belum ditemukan.","err");notice("Memuat order member yang belum approval...");const map=new Map();const qs=[query(collection(db,"penjualan"),where("ownerUid","==",ownerUid)),query(collection(db,"penjualan"),where("ownerId","==",ownerUid))];for(const q of qs){try{const s=await getDocs(q);s.forEach(d=>{const x={id:d.id,...d.data()};const status=String(x.status||x.approvalStatus||"").toLowerCase().replace(/\s+/g,"_");const tipe=String(x.tipeTransaksi||x.tipeOrder||"").toLowerCase();const sumber=String(x.sumber||x.source||"").toLowerCase();const member=tipe.includes("member")||sumber.includes("member")||x.jenisTransaksi==="member";const pending=["menunggu_approval","pending","menungguapproval"].includes(status);if(member&&pending)map.set(d.id,x)})}catch(e){console.warn(e)}}rows=[...map.values()];render();notice(`Akun aktif • ${rows.length} order menunggu approval.`,"ok")}
function message(){const p=aggregate().sort((a,b)=>label(a).localeCompare(label(b),"id"));let t="*ORDER PRODUK*\n\n";p.forEach((x,i)=>{t+=`${i+1}. ${label(x)} — *${x.qty} pcs*\n`});t+=`\n*TOTAL: ${p.reduce((s,x)=>s+x.qty,0)} pcs*\n\nMohon diproses sesuai stok yang tersedia.\nTerima kasih.`;return t}
window.sendWA=()=>{if(!rows.length)return notice("Belum ada order yang menunggu approval.","err");window.open("https://wa.me/?text="+encodeURIComponent(message()),"_blank")};
$("search").addEventListener("input",render);$("sort").addEventListener("change",render);$("dark").onclick=()=>{document.body.classList.toggle("darkmode");$("dark").textContent=document.body.classList.contains("darkmode")?"☀️":"🌙"};
onAuthStateChanged(auth,async u=>{if(!u)return notice("Belum login.","err");try{uid=u.uid;$("email").textContent=u.email||"-";const s=await getDoc(doc(db,"users",uid));const p=s.exists()?s.data():{};ownerUid=ownerOf(p);await load()}catch(e){console.error(e);notice(e.message||"Gagal memuat data.","err")}});
</script>
</body>
</html>
